<div class="app" id="app">
  <header class="topbar">
    <button class="world-switch" id="world-switch" aria-haspopup="dialog">
      <span class="world-switch__sigil"><svg width="18" height="18"><use href="#i-compass"/></svg></span>
      <span class="world-switch__text">
        <span class="world-switch__name" id="world-name">세계관</span>
        <span class="world-switch__sub" id="world-sub">불러오는 중…</span>
      </span>
    </button>
    <div class="topbar__actions">
      <button class="icon-btn" id="btn-generator" aria-label="이름·지명 추천">
        <svg><use href="#i-sparkles"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" aria-label="테마 바꾸기">
        <svg><use href="#i-moon"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="view is-active" id="view-dashboard" data-view="dashboard"><div id="dash-host"></div></section>
    <section class="view" id="view-characters" data-view="characters"><div id="chars-host"></div></section>
    <section class="view" id="view-relations" data-view="relations"><div id="rel-host"></div></section>
    <section class="view" id="view-timeline" data-view="timeline"><div id="tl-host"></div></section>
    <section class="view" id="view-map" data-view="map"><div id="map-host"></div></section>
    <section class="view" id="view-lore" data-view="lore"><div id="lore-host"></div></section>
    <section class="view" id="view-episodes" data-view="episodes"><div id="ep-host"></div></section>
  </main>

  <button class="fab" id="fab" hidden aria-label="새로 추가">
    <svg><use href="#i-plus"/></svg>
  </button>

  <nav class="tabbar" id="tabbar" aria-label="주요 메뉴">
    <button class="tab is-active" data-tab="dashboard"><svg><use href="#i-globe"/></svg><span>세계관</span></button>
    <button class="tab" data-tab="characters"><svg><use href="#i-users"/></svg><span>인물</span></button>
    <button class="tab" data-tab="relations"><svg><use href="#i-network"/></svg><span>관계도</span></button>
    <button class="tab" data-tab="timeline"><svg><use href="#i-clock"/></svg><span>연표</span></button>
    <button class="tab" data-tab="map"><svg><use href="#i-pin"/></svg><span>지도</span></button>
    <button class="tab" data-tab="more"><svg><use href="#i-more"/></svg><span>더보기</span></button>
  </nav>
</div>

<div id="sheet-root"></div>
<div id="toast-root"></div>
