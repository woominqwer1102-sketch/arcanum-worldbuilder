/* =========================================================
   ARCANUM · 인물 관계도 (interactive SVG)
   ========================================================= */
(function (global) {
  'use strict';

  const U = global.UI;

  const TYPES = {
    alliance: { label: '동맹', color: '#63a67f' },
    hostile: { label: '적대', color: '#c0626b' },
    family: { label: '가족', color: '#c9a05a' },
    love: { label: '연인', color: '#d98aa8' },
    mentor: { label: '스승', color: '#7f9fd0' },
    student: { label: '제자', color: '#8fb4d8' },
    rival: { label: '라이벌', color: '#b487c9' },
    other: { label: '기타', color: '#9a9282' }
  };

  const state = {
    host: null,
    svg: null,
    opts: {},
    view: { x: 0, y: 0, w: 360, h: 520 },
    mode: 'view',
    selected: [],
    drag: null,
    pointers: new Map(),
    pinch: null,
    legend: true,
    mounted: false
  };

  function world() { return state.opts.world ? state.opts.world() : null; }

  function nodeMap() {
    const w = world();
    const map = new Map();
    (w ? w.characters : []).forEach((c) => map.set(c.id, c));
    return map;
  }

  function applyView() {
    if (!state.svg) return;
    const v = state.view;
    state.svg.setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h);
  }

  function toWorld(clientX, clientY) {
    if (!state.svg) return { x: 0, y: 0 };
    const pt = state.svg.createSVGPoint();
    pt.x = clientX;
    pt.y = clientY;
    const ctm = state.svg.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    const p = pt.matrixTransform(ctm.inverse());
    return { x: p.x, y: p.y };
  }

  function scaleFactor() {
    if (!state.svg) return 1;
    const ctm = state.svg.getScreenCTM();
    if (!ctm || !ctm.a) return 1;
    return ctm.a;
  }

  function edgeGeometry(a, b, offset) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const ox = (-dy / len) * offset;
    const oy = (dx / len) * offset;
    const cx = (a.x + b.x) / 2 + ox;
    const cy = (a.y + b.y) / 2 + oy;
    return {
      d: 'M' + a.x + ' ' + a.y + ' Q' + cx + ' ' + cy + ' ' + b.x + ' ' + b.y,
      mx: (a.x + 2 * cx + b.x) / 4,
      my: (a.y + 2 * cy + b.y) / 4
    };
  }

  function truncate(name, n) {
    const s = String(name || '');
    return s.length > (n || 7) ? s.slice(0, n || 7) + '…' : s;
  }

  function renderEdges(svg, chars) {
    const w = world();
    const group = svg.querySelector('.gedges');
    if (!group) return;
    const byPair = new Map();
    const relations = (w ? w.relations : []).slice();
    relations.forEach((r) => {
      const key = [r.a, r.b].sort().join('|');
      if (!byPair.has(key)) byPair.set(key, []);
      byPair.get(key).push(r);
    });

    let html = '';
    byPair.forEach((list) => {
      list.forEach((r, i) => {
        const a = chars.get(r.a);
        const b = chars.get(r.b);
        if (!a || !b) return;
        const offset = (i - (list.length - 1) / 2) * 30;
        const g = edgeGeometry(a.pos, b.pos, offset);
        const type = TYPES[r.type] || TYPES.other;
        const label = r.label || type.label;
        const dash = r.type === 'hostile' ? ' stroke-dasharray="7 5"' : (r.type === 'student' ? ' stroke-dasharray="2 3"' : '');
        // 스승 → 제자 방향을 점선 화살표 느낌으로 구분한다
        const arrow = (r.type === 'mentor' || r.type === 'student')
          ? '<circle cx="' + g.mx + '" cy="' + g.my + '" r="2.2" fill="' + type.color + '" opacity=".85"/>'
          : '';
        html +=
          '<g class="gedge" data-edge="' + U.esc(r.id) + '">' +
            '<path d="' + g.d + '" fill="none" stroke="' + type.color + '" stroke-width="1.6" stroke-linecap="round" opacity=".9"' + dash + '/>' +
            '<path d="' + g.d + '" fill="none" stroke="transparent" stroke-width="12" style="pointer-events:stroke;cursor:pointer"/>' +
            arrow +
            '<rect x="' + (g.mx - Math.min(46, (label.length * 3.4 + 7) / 2)) + '" y="' + (g.my - 6) + '" width="' + Math.min(92, label.length * 3.4 + 7) + '" height="12" rx="6" fill="#141010" fill-opacity=".82" stroke="' + type.color + '" stroke-opacity=".5" stroke-width=".7"/>' +
            '<text x="' + g.mx + '" y="' + (g.my + 2.4) + '" text-anchor="middle" font-size="6.4" fill="' + type.color + '" font-family="-apple-system, sans-serif">' + U.esc(truncate(label, 13)) + '</text>' +
          '</g>';
      });
    });
    group.innerHTML = html;
  }

  function renderNodes(svg, chars) {
    const group = svg.querySelector('.gnodes');
    if (!group) return;
    let defs = '';
    let html = '';
    chars.forEach((c) => {
      const selected = state.selected.indexOf(c.id) > -1;
      const hasImg = !!c.image;
      const r = 18;
      if (hasImg) {
        defs += '<clipPath id="clip_' + U.esc(c.id) + '"><circle cx="' + c.pos.x + '" cy="' + c.pos.y + '" r="' + r + '"/></clipPath>';
      }
      html +=
        '<g class="gnode' + (selected ? ' is-selected' : '') + '" data-node="' + U.esc(c.id) + '" transform="translate(' + c.pos.x + ' ' + c.pos.y + ')">' +
          (selected ? '<circle r="24" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="2 2" opacity=".9"/>' : '') +
          '<circle r="' + r + '" fill="#241a12" stroke="#d4af37" stroke-width="1.4" stroke-opacity=".75"/>' +
          (hasImg
            ? '<image href="' + U.esc(c.image) + '" x="' + (c.pos.x - r) + '" y="' + (c.pos.y - r) + '" width="' + (r * 2) + '" height="' + (r * 2) + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip_' + U.esc(c.id) + ')" style="pointer-events:none"/>'
            : '<text y="4.5" text-anchor="middle" font-size="13" fill="#d8b864" font-family="Georgia, \'AppleMyungjo\', serif">' + U.esc(U.initials(c.name)) + '</text>') +
          '<text class="gnode-lbl" y="32" text-anchor="middle" font-size="8.4" stroke-width="2.2" paint-order="stroke" stroke-linejoin="round" font-family="-apple-system, sans-serif">' + U.esc(truncate(c.name, 8)) + '</text>' +
        '</g>';
    });
    svg.querySelector('.gdefs-clip').innerHTML = defs;
    group.innerHTML = html;
  }

  function updateNodeTransform(c) {
    const g = state.svg.querySelector('[data-node="' + c.id + '"]');
    if (g) g.setAttribute('transform', 'translate(' + c.pos.x + ' ' + c.pos.y + ')');
  }

  function refresh() {
    if (!state.svg) return;
    const chars = nodeMap();
    renderEdges(state.svg, chars);
    renderNodes(state.svg, chars);
    applyView();
    updateHint();
  }

  function updateHint() {
    const hint = state.host && state.host.querySelector('.graph-hint');
    if (!hint) return;
    if (!nodeMap().size) {
      hint.textContent = '인물을 먼저 추가하면 관계도가 그려집니다.';
    } else if (state.mode === 'link') {
      hint.textContent = state.selected.length
        ? '상대 인물을 한 명 더 탭하세요.'
        : '관계를 이을 인물 두 명을 차례로 탭하세요.';
    } else {
      hint.textContent = '노드를 끌어 옮기고, 탭하면 인물 상세가 열립니다.';
    }
  }

  function setLinkMode(on) {
    state.mode = on ? 'link' : 'view';
    state.selected = [];
    if (state.svg) refresh();
    const btn = state.host && state.host.querySelector('[data-graph="link"]');
    if (btn) btn.classList.toggle('is-on', on);
  }

  function clearSelection() {
    state.selected = [];
    refresh();
  }

  function handleTap(target, clientX, clientY) {
    const nodeEl = target.closest ? target.closest('[data-node]') : null;
    const edgeEl = target.closest ? target.closest('[data-edge]') : null;
    if (nodeEl) {
      const id = nodeEl.getAttribute('data-node');
      if (state.mode === 'link') {
        if (state.selected.length === 0) {
          state.selected = [id];
          refresh();
          U.haptic(8);
        } else if (state.selected.length === 1) {
          if (state.selected[0] === id) {
            clearSelection();
            return;
          }
          const a = state.selected[0];
          state.selected = [];
          refresh();
          if (state.opts.onLinkPair) state.opts.onLinkPair(a, id);
        }
      } else if (state.opts.onNode) {
        state.opts.onNode(id);
      }
      return;
    }
    if (edgeEl && state.opts.onEdge) {
      state.opts.onEdge(edgeEl.getAttribute('data-edge'));
    }
  }

  function bind() {
    const svg = state.svg;

    svg.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button > 0) return;
      state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (state.pointers.size === 2) {
        const pts = Array.from(state.pointers.values());
        state.pinch = {
          dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
          view: Object.assign({}, state.view),
          midX: (pts[0].x + pts[1].x) / 2,
          midY: (pts[0].y + pts[1].y) / 2
        };
        state.drag = null;
        return;
      }
      if (state.pointers.size > 2) return;

      const nodeEl = e.target.closest ? e.target.closest('[data-node]') : null;
      const edgeEl = e.target.closest ? e.target.closest('[data-edge]') : null;
      const chars = nodeMap();
      if (nodeEl) {
        const c = chars.get(nodeEl.getAttribute('data-node'));
        if (c) {
          state.drag = { type: 'node', id: c.id, startX: e.clientX, startY: e.clientY, moved: 0, origin: e.target };
        }
      } else if (edgeEl) {
        state.drag = { type: 'edge', id: edgeEl.getAttribute('data-edge'), startX: e.clientX, startY: e.clientY, moved: 0, origin: e.target };
      } else {
        state.drag = { type: 'pan', startX: e.clientX, startY: e.clientY, view: Object.assign({}, state.view), moved: 0, origin: e.target };
      }
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    });

    svg.addEventListener('pointermove', (e) => {
      if (!state.pointers.has(e.pointerId)) return;
      state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (state.pinch && state.pointers.size === 2) {
        const pts = Array.from(state.pointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        const midX = (pts[0].x + pts[1].x) / 2;
        const midY = (pts[0].y + pts[1].y) / 2;
        const factor = U.clamp(dist / state.pinch.dist, 0.25, 4);
        const before = toWorld(midX, midY);
        const newW = U.clamp(state.pinch.view.w / factor, 90, 900);
        const newH = newW * (state.pinch.view.h / state.pinch.view.w);
        state.view.w = newW;
        state.view.h = newH;
        state.view.x = state.pinch.view.x;
        state.view.y = state.pinch.view.y;
        applyView();
        const after = toWorld(midX, midY);
        state.view.x += before.x - after.x;
        state.view.y += before.y - after.y;
        applyView();
        e.preventDefault();
        return;
      }

      const drag = state.drag;
      if (!drag) return;
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));

      if (drag.type === 'node') {
        const c = nodeMap().get(drag.id);
        if (!c) return;
        const p = toWorld(e.clientX, e.clientY);
        c.pos.x = Math.round(U.clamp(p.x, 24, 336));
        c.pos.y = Math.round(U.clamp(p.y, 24, 496));
        updateNodeTransform(c);
        renderEdges(state.svg, nodeMap());
        e.preventDefault();
      } else if (drag.type === 'pan') {
        const s = scaleFactor() || 1;
        state.view.x = drag.view.x - dx / s;
        state.view.y = drag.view.y - dy / s;
        applyView();
        e.preventDefault();
      }
    });

    function endPointer(e) {
      const wasDrag = state.drag;
      state.pointers.delete(e.pointerId);

      if (state.pointers.size < 2) state.pinch = null;

      if (wasDrag && wasDrag.moved < 6) {
        handleTap(wasDrag.origin || e.target, e.clientX, e.clientY);
      } else if (wasDrag && wasDrag.type === 'node') {
        if (state.opts.onNodeMoved) state.opts.onNodeMoved();
        U.haptic(6);
      }
      state.drag = null;
    }

    svg.addEventListener('pointerup', endPointer);
    svg.addEventListener('pointercancel', (e) => {
      state.pointers.delete(e.pointerId);
      state.pinch = null;
      state.drag = null;
    });
    svg.addEventListener('pointerleave', (e) => {
      if (state.drag && state.drag.type === 'node' && state.pointers.size === 0) state.drag = null;
    });

    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoom(e.deltaY < 0 ? 1.12 : 0.9);
    }, { passive: false });
  }

  function zoom(f) {
    const v = state.view;
    const cx = v.x + v.w / 2;
    const cy = v.y + v.h / 2;
    const w = U.clamp(v.w / f, 90, 900);
    const h = w * (v.h / v.w);
    state.view = { x: cx - w / 2, y: cy - h / 2, w: w, h: h };
    applyView();
  }

  function fit() {
    const chars = nodeMap();
    if (!chars.size) {
      state.view = { x: 0, y: 0, w: 360, h: 520 };
      applyView();
      return;
    }
    let minX = 9999, minY = 9999, maxX = -9999, maxY = -9999;
    chars.forEach((c) => {
      minX = Math.min(minX, c.pos.x);
      minY = Math.min(minY, c.pos.y);
      maxX = Math.max(maxX, c.pos.x);
      maxY = Math.max(maxY, c.pos.y);
    });
    const pad = 56;
    const w = Math.max(200, maxX - minX + pad * 2);
    const h = Math.max(240, maxY - minY + pad * 2);
    const ratio = (state.svg && state.svg.getBoundingClientRect().height / state.svg.getBoundingClientRect().width) || 1.45;
    let vw = w;
    let vh = w * ratio;
    if (vh < h) { vh = h; vw = h / ratio; }
    state.view = {
      x: (minX + maxX) / 2 - vw / 2,
      y: (minY + maxY) / 2 - vh / 2,
      w: vw,
      h: vh
    };
    applyView();
  }

  function mount(host, opts) {
    state.host = host;
    state.opts = opts || {};
    state.mounted = true;
    state.mode = 'view';
    state.selected = [];
    state.pointers = new Map();
    state.pinch = null;
    state.drag = null;

    host.innerHTML =
      '<svg id="graph-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">' +
        '<defs class="gdefs-clip"></defs>' +
        '<g class="gedges"></g>' +
        '<g class="gnodes"></g>' +
      '</svg>' +
      '<div class="graph-legend">' + Object.keys(TYPES).map((k) =>
        '<span><i style="background:' + TYPES[k].color + '"></i>' + TYPES[k].label + '</span>').join('') + '</div>' +
      '<div class="graph-hint"></div>';

    state.svg = host.querySelector('#graph-svg');
    bind();
    refresh();
    requestAnimationFrame(fit);
    return api;
  }

  function destroy() {
    if (state.host) state.host.innerHTML = '';
    state.svg = null;
    state.host = null;
    state.mounted = false;
  }

  function toggleLegend() {
    state.legend = !state.legend;
    const el = state.host && state.host.querySelector('.graph-legend');
    if (el) el.style.display = state.legend ? '' : 'none';
    return state.legend;
  }

  const api = { mount, refresh, destroy, setLinkMode, fit, zoom, toggleLegend, clearSelection, TYPES, state };

  global.Graph = api;
})(window);

<script>
/* ---- js/factiongraph.js?v=1.4.1 ---- */
/* =========================================================
   ARCANUM · 세력 관계도 (faction relations, interactive SVG)
   설정집 '세력·국가' 항목을 노드로, world.factionRelations를 선으로 그린다.
   ========================================================= */
(function (global) {
  'use strict';

  const U = global.UI;

  const TYPES = {
    ally: { label: '동맹', color: '#63a67f' },
    hostile: { label: '적대', color: '#c0626b' },
    rival: { label: '경쟁', color: '#b487c9' },
    subject: { label: '종속', color: '#c9a05a' },
    trade: { label: '교역·협정', color: '#7fa9d8' }
  };

  const state = {
    host: null,
    svg: null,
    opts: {},
    view: { x: 0, y: 0, w: 360, h: 520 },
    mode: 'view',
    selected: [],
    drag: null,
    pointers: new Map(),
    pinch: null,
    mounted: false
  };

  function world() { return state.opts.world ? state.opts.world() : null; }

  function factions() {
    const w = world();
    // 국가와 세력을 함께 노드로 — 국가는 바깥 점선 고리로 구분한다
    return ((w && w.lore) || []).filter((l) => l.category === 'faction' || l.category === 'nation');
  }

  function posOf(w, l, i, total) {
    if (!w.factionNodes) w.factionNodes = {};
    let p = w.factionNodes[l.id];
    if (!p) {
      // 원형으로 흩어 놓는다
      const angle = (i / Math.max(1, total)) * Math.PI * 2 - Math.PI / 2;
      const n = Math.max(1, total);
      // 노드가 많을수록 고리를 넓혀 이름이 겹치지 않게
      const rx = 100 + Math.min(80, n * 6.5);
      const ry = 150 + Math.min(120, n * 9.5);
      // 안팎으로 번갈아 놓아 이름이 겹치지 않게
      const k = i % 2 ? 0.7 : 1;
      p = { x: Math.round(180 + Math.cos(angle) * rx * k), y: Math.round(260 + Math.sin(angle) * ry * k) };
      w.factionNodes[l.id] = p;
    }
    return p;
  }

  function nationNameOf(w, l) {
    if (!l || !l.nationId) return '';
    const n = ((w && w.lore) || []).find((x) => x.id === l.nationId);
    return n ? n.title : '';
  }

  function raceNamesOf(w, l) {
    return ((l && l.raceIds) || []).map((id) => {
      const r = ((w && w.lore) || []).find((x) => x.id === id);
      return r ? r.title : '';
    }).filter(Boolean);
  }

  function nodeList() {
    const w = world();
    const list = factions();
    return list.map((l, i) => Object.assign({ lore: l, pos: posOf(w, l, i, list.length) }, l));
  }

  function applyView() {
    if (!state.svg) return;
    const v = state.view;
    state.svg.setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h);
  }

  function scaleFactor() {
    if (!state.svg) return 1;
    const r = state.svg.getBoundingClientRect();
    return r.width ? (state.view.w / r.width) : 1;
  }

  function toWorld(clientX, clientY) {
    const r = state.svg.getBoundingClientRect();
    const s = scaleFactor();
    return { x: state.view.x + (clientX - r.left) * s, y: state.view.y + (clientY - r.top) * s };
  }

  function edgeGeometry(a, b) {
    return { x1: a.x, y1: a.y, x2: b.x, y2: b.y, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  }

  function truncate(name, n) {
    const s = String(name || '');
    return s.length > (n || 7) ? s.slice(0, n || 7) + '…' : s;
  }

  function render() {
    const svg = state.svg;
    if (!svg) return;
    const w = world();
    const nodes = nodeList();
    const byId = new Map(nodes.map((n) => [n.id, n]));
    const edges = svg.querySelector('.fedges');
    const gnodes = svg.querySelector('.fnodes');
    if (!edges || !gnodes) return;

    let ehtml = '';
    ((w && w.factionRelations) || []).forEach((r) => {
      const a = byId.get(r.a);
      const b = byId.get(r.b);
      if (!a || !b) return;
      const g = edgeGeometry(a.pos, b.pos);
      const type = TYPES[r.type] || TYPES.ally;
      const label = r.label || type.label;
      const dash = r.type === 'hostile' ? ' stroke-dasharray="7 5"' : (r.type === 'subject' ? ' stroke-dasharray="4 3"' : '');
      ehtml +=
        '<g class="fedge" data-fedge="' + U.esc(r.id) + '">' +
          '<line x1="' + g.x1 + '" y1="' + g.y1 + '" x2="' + g.x2 + '" y2="' + g.y2 + '" stroke="' + type.color + '" stroke-width="1.7" opacity=".85"' + dash + '/>' +
          '<line x1="' + g.x1 + '" y1="' + g.y1 + '" x2="' + g.x2 + '" y2="' + g.y2 + '" stroke="transparent" stroke-width="14" style="pointer-events:stroke;cursor:pointer"/>' +
          '<rect x="' + (g.mx - Math.min(44, (label.length * 3.5 + 8) / 2)) + '" y="' + (g.my - 6.5) + '" width="' + Math.min(88, label.length * 3.5 + 8) + '" height="13" rx="6.5" fill="#141010" fill-opacity=".84" stroke="' + type.color + '" stroke-opacity=".5" stroke-width=".7"/>' +
          '<text x="' + g.mx + '" y="' + (g.my + 2.6) + '" text-anchor="middle" font-size="6.6" fill="' + type.color + '" font-family="-apple-system, sans-serif">' + U.esc(truncate(label, 13)) + '</text>' +
        '</g>';
    });

    let nhtml = '';
    nodes.forEach((n) => {
      const selected = state.selected.indexOf(n.id) > -1;
      const color = n.color || '#c9a24a';
      const isNation = n.category === 'nation';
      const races = isNation ? raceNamesOf(w, n) : [];
      const nation = isNation ? '' : nationNameOf(w, n);
      nhtml +=
        '<g class="fnode' + (selected ? ' is-selected' : '') + '" data-fnode="' + U.esc(n.id) + '" transform="translate(' + n.pos.x + ' ' + n.pos.y + ')">' +
          (selected ? '<circle r="26" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="2 2" opacity=".9"/>' : '') +
          (isNation ? '<circle r="24" fill="none" stroke="' + color + '" stroke-width="1" stroke-dasharray="1.6 2.6" opacity=".7"/>' : '') +
          '<circle r="21" fill="#1a1411" stroke="' + color + '" stroke-width="1.4" opacity=".95"/>' +
          '<text text-anchor="middle" y="4.4" font-size="11" fill="' + color + '" font-family="AppleMyungjo, Georgia, serif">' + U.esc(String(n.title || '').slice(0, 1)) + '</text>' +
          '<text class="fnode-label" text-anchor="middle" y="33" font-size="7.2" fill="#d8cdb4" stroke="#100d0b" stroke-width="2.4" paint-order="stroke" font-family="-apple-system, sans-serif">' + U.esc(truncate(n.title, 9)) + '</text>' +
          (races.length ? '<text class="fnode-race" text-anchor="middle" y="41" font-size="5.6" fill="#9c9078" stroke="#100d0b" stroke-width="1.8" paint-order="stroke" font-family="-apple-system, sans-serif">' + U.esc(truncate(races.join(' · '), 14)) + '</text>' : '') +
          (!isNation ? '<text class="fnode-nation" text-anchor="middle" y="41" font-size="5.6" fill="' + (nation ? '#c0a463' : '#7d7466') + '" stroke="#100d0b" stroke-width="1.8" paint-order="stroke" font-family="-apple-system, sans-serif">' + U.esc(nation || '무소속') + '</text>' : '') +
        '</g>';
    });

    edges.innerHTML = ehtml;
    gnodes.innerHTML = nhtml;
  }

  function handleTap(target, clientX, clientY) {
    const nodeEl = target.closest ? target.closest('[data-fnode]') : null;
    if (nodeEl) {
      const id = nodeEl.getAttribute('data-fnode');
      if (state.mode === 'link') {
        if (state.selected.indexOf(id) > -1) return;
        state.selected.push(id);
        if (state.selected.length === 2) {
          const a = state.selected[0];
          const b = state.selected[1];
          state.selected = [];
          state.mode = 'view';
          render();
          if (state.opts.onLinkPair) state.opts.onLinkPair(a, b);
        } else {
          render();
        }
        return;
      }
      if (state.opts.onNode) state.opts.onNode(id);
      return;
    }
    const edgeEl = target.closest ? target.closest('[data-fedge]') : null;
    if (edgeEl && state.opts.onEdge) state.opts.onEdge(edgeEl.getAttribute('data-fedge'));
  }

  function bind() {
    const svg = state.svg;

    svg.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button > 0) return;
      state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (state.pointers.size === 2) {
        const pts = Array.from(state.pointers.values());
        state.pinch = { dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1, view: Object.assign({}, state.view) };
        state.drag = null;
        return;
      }
      if (state.pointers.size > 2) return;
      const nodeEl = e.target.closest ? e.target.closest('[data-fnode]') : null;
      if (nodeEl) {
        state.drag = { type: 'node', id: nodeEl.getAttribute('data-fnode'), startX: e.clientX, startY: e.clientY, moved: 0, origin: e.target };
      } else {
        state.drag = { type: 'pan', startX: e.clientX, startY: e.clientY, view: Object.assign({}, state.view), moved: 0, origin: e.target };
      }
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    });

    svg.addEventListener('pointermove', (e) => {
      if (!state.pointers.has(e.pointerId)) return;
      state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (state.pinch && state.pointers.size === 2) {
        const pts = Array.from(state.pointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        const factor = U.clamp(dist / state.pinch.dist, 0.3, 4);
        const v = state.pinch.view;
        const cx = v.x + v.w / 2, cy = v.y + v.h / 2;
        const nw = U.clamp(v.w / factor, 90, 900);
        const nh = nw * (v.h / v.w);
        state.view = { x: cx - nw / 2, y: cy - nh / 2, w: nw, h: nh };
        applyView();
        e.preventDefault();
        return;
      }
      const drag = state.drag;
      if (!drag) return;
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
      if (drag.type === 'node') {
        const w = world();
        if (!w || !w.factionNodes) return;
        const p = toWorld(e.clientX, e.clientY);
        const cur = w.factionNodes[drag.id] || { x: 180, y: 260 };
        // 노드 중심을 잡고 끌도록 클릭 지점과의 차이를 반영
        if (!drag.grab) drag.grab = { x: cur.x - toWorld(drag.startX, drag.startY).x, y: cur.y - toWorld(drag.startX, drag.startY).y };
        cur.x = Math.round(U.clamp(p.x + drag.grab.x, 20, 340));
        cur.y = Math.round(U.clamp(p.y + drag.grab.y, 20, 500));
        render();
        e.preventDefault();
      } else if (drag.type === 'pan') {
        const s = scaleFactor() || 1;
        state.view.x = drag.view.x - dx * s;
        state.view.y = drag.view.y - dy * s;
        applyView();
        e.preventDefault();
      }
    });

    function endPointer(e) {
      const wasDrag = state.drag;
      state.pointers.delete(e.pointerId);
      if (state.pointers.size < 2) state.pinch = null;
      if (wasDrag && wasDrag.moved < 6) handleTap(wasDrag.origin || e.target, e.clientX, e.clientY);
      else if (wasDrag && wasDrag.type === 'node' && state.opts.onNodeMoved) state.opts.onNodeMoved();

    svg.addEventListener('pointercancel', () => { state.pointers.clear(); state.pinch = null; state.drag = null; });

      e.preventDefault();
      zoom(e.deltaY < 0 ? 1.12 : 0.9);
    }, { passive: false });
  }

  function zoom(f) {
    const v = state.view;
    const cx = v.x + v.w / 2;
    const cy = v.y + v.h / 2;
    const nw = U.clamp(v.w / f, 90, 900);
    const nh = nw * (v.h / v.w);
    state.view = { x: cx - nw / 2, y: cy - nh / 2, w: nw, h: nh };
    applyView();
  }

  function fit() {
    const nodes = nodeList();
    if (!nodes.length) {
      state.view = { x: 0, y: 0, w: 360, h: 520 };
      applyView();
      return;
    }
    let minX = 9999, minY = 9999, maxX = -9999, maxY = -9999;
    nodes.forEach((n) => {
      minX = Math.min(minX, n.pos.x);
      minY = Math.min(minY, n.pos.y);
      maxX = Math.max(maxX, n.pos.x);
      maxY = Math.max(maxY, n.pos.y);
    });
    const pad = 60;
    const bw = Math.max(180, maxX - minX + pad * 2);
    const bh = Math.max(220, maxY - minY + pad * 2);
    const r = state.svg && state.svg.getBoundingClientRect();
    const ratio = (r && r.width) ? (r.height / r.width) : 1.45;
    let vw = bw, vh = bw * ratio;
    if (vh < bh) { vh = bh; vw = bh / ratio; }
    state.view = { x: (minX + maxX) / 2 - vw / 2, y: (minY + maxY) / 2 - vh / 2, w: vw, h: vh };
    applyView();
  }

  function setLinkMode(on) {
    state.mode = on ? 'link' : 'view';
    state.selected = [];
    render();
    const hint = state.host && state.host.querySelector('.graph-hint');
    if (hint) hint.textContent = on ? '세력을 두 개 차례로 탭하면 관계를 이을 수 있어요' : '';
  }

  function refresh() {
    render();
  }

  function mount(host, opts) {
    state.host = host;
    state.opts = opts || {};
    state.mounted = true;
    state.mode = 'view';
    state.selected = [];
    state.pointers = new Map();
    state.pinch = null;
    state.drag = null;

    host.innerHTML =
      '<svg id="faction-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">' +
        '<g class="fedges"></g>' +
        '<g class="fnodes"></g>' +
      '</svg>' +
      '<div class="graph-legend">' + Object.keys(TYPES).map((k) =>
        '<span><i style="background:' + TYPES[k].color + '"></i>' + TYPES[k].label + '</span>').join('') + '</div>' +
      '<div class="graph-hint"></div>';

    state.svg = host.querySelector('#faction-svg');
    bind();
    refresh();
    requestAnimationFrame(fit);
    return api;
  }

  function destroy() {
    if (state.host) state.host.innerHTML = '';
    state.svg = null;
    state.host = null;
    state.mounted = false;
    state.drag = null;
    state.pointers = new Map();
    state.selected = [];
  }

  const api = { mount, refresh, destroy, fit, zoom, setLinkMode, TYPES, state };
  global.FactionGraph = api;
})(window);

<script>
/* ---- js/worldgen.js?v=1.4.1 ---- */
/* =========================================================
   ARCANUM · 🎲 대륙 랜덤 생성

  const BIG = ['eurasia', 'americas', 'africa'];

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);

      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };

  /* 해안선 프랙탈 — 각 변의 중점을 수직 방향으로 흔들어 리아스식 해안을 만든다 */
  function fractalize(pts, iterations, roughness, rnd) {
    let list = pts.map((p) => [p[0], p[1]]);
    for (let it = 0; it < iterations; it++) {
      const next = [];
      const r = roughness * Math.pow(0.62, it);
      for (let i = 0; i < list.length; i++) {
        const a = list[i];
        const b = list[(i + 1) % list.length];
        next.push(a);
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const len = Math.hypot(dx, dy) || 1;
        const off = (rnd() - 0.5) * len * r;
        next.push([(a[0] + b[0]) / 2 - (dy / len) * off, (a[1] + b[1]) / 2 + (dx / len) * off]);
      }
      list = next;
    }
    return list;
  }

  function bbox(pts) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    pts.forEach((p) => {
      if (p[0] < minX) minX = p[0];
      if (p[0] > maxX) maxX = p[0];
      if (p[1] < minY) minY = p[1];
      if (p[1] > maxY) maxY = p[1];
    });
    return { minX: minX, minY: minY, maxX: maxX, maxY: maxY, w: maxX - minX, h: maxY - minY };
  }

  /* 한 대륙을 회전·반전·확대해 캔버스 위 좌표로 옮긴다 */
  function place(shape, opts) {
    const aspect = shape.aspect || 1;
    const cos = Math.cos(opts.rot);
    const sin = Math.sin(opts.rot);
    return shape.pts.map(([x, y]) => {
      let ux = ((x - 0.5) * aspect) * opts.mx;
      let uy = ((y - 0.5)) * opts.my;
      const rx = ux * cos - uy * sin;
      const ry = ux * sin + uy * cos;
      return [opts.cx + rx * opts.size, opts.cy + ry * opts.size];
    });
  }

  function fitInto(shape, cx, cy, size, rot, mx, my, W, H) {
    let pts = place(shape, { cx: cx, cy: cy, size: size, rot: rot, mx: mx, my: my });
    let box = bbox(pts);
    const maxW = W * 0.94;
    const maxH = H * 0.92;
    // 너무 크면 줄이고, 시작점을 다시 잡는다
    let scale = 1;
    if (box.w > maxW) scale = Math.min(scale, maxW / box.w);
    if (box.h > maxH) scale = Math.min(scale, maxH / box.h);
    if (scale < 1) {
      size *= scale;
      pts = place(shape, { cx: cx, cy: cy, size: size, rot: rot, mx: mx, my: my });
      box = bbox(pts);
    }
    // 캔버스 밖으로 나간 만큼만 안으로 민다
    let dx = 0, dy = 0;
    if (box.minX < W * 0.03) dx = W * 0.03 - box.minX;
    if (box.maxX > W * 0.97) dx = W * 0.97 - box.maxX;
    if (box.minY < H * 0.03) dy = H * 0.03 - box.minY;
    if (box.maxY > H * 0.97) dy = H * 0.97 - box.maxY;
    if (dx || dy) {
      pts = pts.map((p) => [p[0] + dx, p[1] + dy]);
      box = bbox(pts);
    }
    const radius = Math.max(box.w, box.h) / 2;
    return { pts: pts, cx: (box.minX + box.maxX) / 2, cy: (box.minY + box.maxY) / 2, radius: radius, box: box };
  }

  function smoothPath(ctx, pts) {
    const n = pts.length;
    if (!n) return;
    const last = pts[n - 1];
    const first = pts[0];
    ctx.beginPath();
    ctx.moveTo((last[0] + first[0]) / 2, (last[1] + first[1]) / 2);
    for (let i = 0; i < n; i++) {
      const p = pts[i];
      const q = pts[(i + 1) % n];
      ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
    }
    ctx.closePath();
  }

  function drawSea(ctx, W, H, rnd) {
    // 바다 물결선 — 육지가 위에 덮이므로 바다에만 남는다
    const count = Math.round((W * H) / 16000);
    for (let i = 0; i < count; i++) {
      const x = rnd() * W;
      const y = rnd() * H;
      const len = 14 + rnd() * 30;
      const amp = 1.4 + rnd() * 1.8;
      ctx.strokeStyle = 'rgba(' + INK + ',' + (0.07 + rnd() * 0.1).toFixed(3) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let k = 1; k <= 6; k++) {
        ctx.lineTo(x + (len * k) / 6, y + Math.sin(k * 1.15 + rnd() * 0.3) * amp);
      }
      ctx.stroke();
    }
  }

  function drawLand(ctx, pts, W, H) {
    // 1) 옅은 그림자
    ctx.save();
    ctx.translate(4, 6);
    ctx.fillStyle = 'rgba(80,56,30,.14)';
    smoothPath(ctx, pts);
    ctx.fill();
    ctx.restore();

    // 2) 얕은 바다 테두리
    ctx.strokeStyle = 'rgba(96,74,44,.10)';
    ctx.lineWidth = 26;
    ctx.lineJoin = 'round';
    smoothPath(ctx, pts);
    ctx.stroke();

    // 3) 육지 채우기 — 양피지보다 한 톤 밝게
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#f8eed6');
    g.addColorStop(1, '#efe0bd');
    ctx.fillStyle = g;
    smoothPath(ctx, pts);
    ctx.fill();

    // 4) 해안선 — 넓고 옅은 선 위에 가는 세피아 잉크
    ctx.strokeStyle = 'rgba(' + INK + ',.34)';
    ctx.lineWidth = 5;
    ctx.lineJoin = 'round';
    smoothPath(ctx, pts);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(' + INK_DARK + ',.92)';
    ctx.lineWidth = 1.9;
    smoothPath(ctx, pts);
    ctx.stroke();
  }

  function drawIslets(ctx, layout, rnd, W, H) {
    const count = 3 + Math.floor(rnd() * 4);
    let drawn = 0;
    for (let attempt = 0; attempt < count * 8 && drawn < count; attempt++) {
      const x = W * (0.08 + rnd() * 0.84);
      const y = H * (0.08 + rnd() * 0.84);
      let ok = true;
      for (let i = 0; i < layout.length; i++) {
        const l = layout[i];
        if (Math.hypot(x - l.cx, y - l.cy) < l.radius * 0.92) { ok = false; break; }
      }
      if (!ok) continue;
      const r = Math.min(W, H) * (0.012 + rnd() * 0.026);
      const pts = [];
      const steps = 8 + Math.floor(rnd() * 3);
      for (let s2 = 0; s2 < steps; s2++) {
        const a = (s2 / steps) * Math.PI * 2;
        const rr = r * (0.7 + rnd() * 0.6);
        pts.push([x + Math.cos(a) * rr * 1.15, y + Math.sin(a) * rr]);
      }
      drawLand(ctx, fractalize(pts, 2, 0.3, rnd), W, H);
      drawn += 1;
    }
  }

  function drawCompass(ctx, x, y, r, rnd) {
    ctx.save();
    ctx.translate(x, y);
    // 바탕 원
    const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.7);
    halo.addColorStop(0, 'rgba(248,238,214,.85)');
    halo.addColorStop(1, 'rgba(248,238,214,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.7, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(' + INK + ',.75)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.74, 0, Math.PI * 2); ctx.stroke();

    // 8방위 별
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 - Math.PI / 2;
      const long = i % 2 === 0 ? r * 0.92 : r * 0.44;
      const w = r * 0.17;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * long, Math.sin(a) * long);
      ctx.lineTo(Math.cos(a + Math.PI / 2) * w, Math.sin(a + Math.PI / 2) * w);
      ctx.lineTo(Math.cos(a - Math.PI / 2) * w, Math.sin(a - Math.PI / 2) * w);
      ctx.closePath();
      ctx.fillStyle = i % 2 === 0 ? 'rgba(' + INK_DARK + ',.82)' : 'rgba(' + INK + ',.32)';
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(150,110,40,.9)';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawFrame(ctx, W, H) {
    ctx.strokeStyle = 'rgba(' + INK + ',.55)';
    ctx.lineWidth = 3;
    ctx.strokeRect(W * 0.022, H * 0.016, W * 0.956, H * 0.968);
    ctx.strokeStyle = 'rgba(' + INK + ',.32)';
    ctx.lineWidth = 1;
    ctx.strokeRect(W * 0.038, H * 0.028, W * 0.924, H * 0.944);
  }

  /* 대륙 3~5개를 겹치지 않게 배치하고 섬 군도를 곁들인다 */
  function buildLayout(rnd, W, H) {
    const count = 3 + Math.floor(rnd() * 3);           // 대륙 3 ~ 5개
    const pool = Object.keys(SHAPES);
    const primaryName = BIG[Math.floor(rnd() * BIG.length)];
    const picks = [primaryName];
    let guard = 0;
    while (picks.length < count && guard++ < 40) {
      const name = pool[Math.floor(rnd() * pool.length)];
      if (picks.indexOf(name) === -1) picks.push(name);
    }
    if (rnd() < 0.6) picks.push('isles');              // 섬 군도는 덤으로

    const placed = [];
    const out = [];

    picks.forEach((name, i) => {
      const isPrimary = i === 0;
      if (name === 'isles') {
        const isles = buildIsles(rnd, W, H, placed);
        isles.forEach((island) => {
          placed.push({ cx: island.cx, cy: island.cy, radius: island.radius });
          island.isle = true;
          out.push(island);
        });
        return;
      }
      const shape = SHAPES[name];
      const baseSize = isPrimary ? (0.58 + rnd() * 0.14) : (0.24 + rnd() * 0.22);
      const rot = rnd() * Math.PI * 2;
      const mx = rnd() < 0.5 ? -1 : 1;
      const my = rnd() < 0.5 ? -1 : 1;

      let best = null;
      for (let k = 0; k < 34; k++) {
        const spread = isPrimary ? 0.14 : 0.36;
        const cx = W * (0.5 + (rnd() - 0.5) * spread * 2);
        const cy = H * (0.5 + (rnd() - 0.5) * spread * 2);
        const fitted = fitInto(shape, cx, cy, Math.min(W, H) * baseSize, rot, mx, my, W, H);
        let clash = false;
        for (let j = 0; j < placed.length; j++) {
          const d = Math.hypot(fitted.cx - placed[j].cx, fitted.cy - placed[j].cy);
          if (d < (fitted.radius + placed[j].radius) * 0.62) { clash = true; break; }
        }
        if (!best) best = fitted;
        if (!clash) { best = fitted; break; }
      }
      placed.push({ cx: best.cx, cy: best.cy, radius: best.radius });
      out.push({ pts: fractalize(best.pts, 4, 0.36, rnd), cx: best.cx, cy: best.cy, radius: best.radius, box: best.box });
    });

    return out;
  }

  /* 섬 군도 — 영국·일본처럼 호를 그리는 작은 섬들 */
  function buildIsles(rnd, W, H, placed) {
    const n = 4 + Math.floor(rnd() * 4);
    const baseX = W * (0.22 + rnd() * 0.56);
    const baseY = H * (0.22 + rnd() * 0.56);
    const angle = rnd() * Math.PI * 2;
    const out = [];
    for (let i = 0; i < n; i++) {
      const t = (i / Math.max(1, n - 1)) - 0.5;
      const cx = baseX + Math.cos(angle) * t * W * 0.34 + (rnd() - 0.5) * W * 0.05;
      const cy = baseY + Math.sin(angle) * t * H * 0.34 + (rnd() - 0.5) * H * 0.05;
      let r = Math.min(W, H) * (0.035 + rnd() * 0.055);
      let clash = false;
      for (let j = 0; j < placed.length; j++) {
        const d = Math.hypot(cx - placed[j].cx, cy - placed[j].cy);
        if (d < (r + placed[j].radius) * 0.7) { clash = true; break; }
      }
      if (clash) r *= 0.6;
      const pts = [];
      const steps = 9 + Math.floor(rnd() * 4);
      for (let s = 0; s < steps; s++) {
        const a = (s / steps) * Math.PI * 2;
        const rr = r * (0.76 + rnd() * 0.46);
        pts.push([cx + Math.cos(a) * rr * 1.1, cy + Math.sin(a) * rr]);
      }
      out.push({ pts: fractalize(pts, 2, 0.3, rnd), cx: cx, cy: cy, radius: r, box: bbox(pts) });
    }
    return out;
  }

  function chooseCompassSpot(layout, W, H) {
    // 육지에서 가장 먼 모서리
    const corners = [
      { x: W * 0.14, y: H * 0.13 },
      { x: W * 0.86, y: H * 0.13 },
      { x: W * 0.14, y: H * 0.87 },
      { x: W * 0.86, y: H * 0.87 }
    ];
    let best = corners[0];
    let bestScore = -1;
    corners.forEach((c) => {
      let score = Infinity;
      layout.forEach((l) => {
        const d = Math.hypot(c.x - l.cx, c.y - l.cy) - l.radius;
        if (d < score) score = d;
      });
      if (score > bestScore) { bestScore = score; best = c; }
    });
    return best;
  }

  /* 메인: 양피지 세계지도 한 장을 data URL로 돌려준다 */
  function continent(opts) {
    const o = opts || {};
    const W = o.width || 1000;
    const H = o.height || 1333;
    const seed = (typeof o.seed === 'number') ? o.seed : Math.floor(Math.random() * 1e9);
    const rnd = mulberry32(seed);

    const cv = document.createElement('canvas');
    cv.width = W;
    cv.height = H;
    const ctx = cv.getContext('2d');
    if (!ctx) throw new Error('캔버스를 만들지 못했어요.');

    // 1) 양피지 바탕 (업로드 변환과 같은 질감)
    if (global.MapView && typeof global.MapView.parchmentBase === 'function') {
      global.MapView.parchmentBase(ctx, W, H);
    } else {
      ctx.fillStyle = '#eedcb8';
      ctx.fillRect(0, 0, W, H);
    }

    // 2) 바다 물결
    drawSea(ctx, W, H, rnd);

    // 3) 대륙
    const layout = buildLayout(rnd, W, H);
    layout.forEach((land) => drawLand(ctx, land.pts, W, H));

    // 3-1) 대륙 곁의 작은 섬들 (리아스식 해안의 부속섬 느낌)
    drawIslets(ctx, layout, rnd, W, H);

    // 4) 나침반 · 테두리
    const spot = chooseCompassSpot(layout, W, H);
    drawCompass(ctx, spot.x, spot.y, Math.min(W, H) * 0.062, rnd);
    drawFrame(ctx, W, H);

    let dataURL = '';
    try {
      dataURL = cv.toDataURL('image/jpeg', 0.9);
    } catch (e) {
      dataURL = cv.toDataURL('image/png');
    }
    const mains = layout.filter((l) => !l.isle).length;
    return { dataURL: dataURL, width: W, height: H, seed: seed, continents: mains };
  }

  global.WorldGen = {
    continent: continent,
    shapes: SHAPES,
    _internals: { fractalize: fractalize, buildLayout: buildLayout, place: place, bbox: bbox, mulberry32: mulberry32 }
  };
})(window);

</script>
