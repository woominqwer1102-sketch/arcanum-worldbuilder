/* =========================================================
   ARCANUM · 판타지 세계관 노트
   Mobile-first (390–430px) dark fantasy + parchment theme
   ========================================================= */

:root {
  --font-display: "AppleMyungjo", "Nanum Myeongjo", "Noto Serif KR", ui-serif, Georgia, "Times New Roman", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  --nav-h: 62px;
  --top-h: 54px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --ease: cubic-bezier(.22, 1, .36, 1);
}

[data-theme="dark"] {
  --bg: #100d0b;
  --bg-glow-1: rgba(212, 175, 55, .10);
  --bg-glow-2: rgba(120, 60, 30, .16);
  --surface: #201a15;
  --surface-2: #191411;
  --surface-3: #2a2119;
  --line: rgba(212, 175, 55, .18);
  --line-strong: rgba(212, 175, 55, .42);
  --gold: #d4af37;
  --gold-soft: #ead07a;
  --gold-deep: #9c7a24;
  --text: #f4ebd0;
  --text-dim: #cabfa4;
  --muted: #8d846f;
  --ink: #1a1412;
  --parchment: #f4ebd0;
  --parchment-line: rgba(90, 70, 40, .35);
  --glass: rgba(16, 13, 11, .82);
  --shadow: 0 18px 40px rgba(0, 0, 0, .5);
  --shadow-sm: 0 6px 18px rgba(0, 0, 0, .35);
  --danger: #c9636b;
  --ok: #7fb08b;
  --map-bg: #d9c9a4;
}

[data-theme="parchment"] {
  --bg: #eadfc3;
  --bg-glow-1: rgba(255, 255, 255, .55);
  --bg-glow-2: rgba(150, 110, 50, .18);
  --surface: #f9f2df;
  --surface-2: #f3e9ce;
  --surface-3: #fffaf0;
  --line: rgba(122, 92, 42, .22);
  --line-strong: rgba(122, 92, 42, .48);
  --gold: #96701c;
  --gold-soft: #b98f2c;
  --gold-deep: #6d5220;
  --text: #2b2118;
  --text-dim: #554631;
  --muted: #7c6b51;
  --ink: #fdf8ec;
  --parchment: #fdf8ec;
  --parchment-line: rgba(120, 92, 50, .3);
  --glass: rgba(249, 242, 223, .88);
  --shadow: 0 14px 30px rgba(80, 60, 25, .16);
  --shadow-sm: 0 4px 14px rgba(80, 60, 25, .12);
  --danger: #a83c45;
  --ok: #3f7a52;
  --map-bg: #d9c9a4;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  /* 가로로 삐져나가는 내용이 화면을 줄여(줌아웃) 고정 단추가 밖으로 밀리는 것을 막는다 */
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: none;
  background-image:
    radial-gradient(120% 70% at 50% -10%, var(--bg-glow-1) 0%, transparent 60%),
    radial-gradient(90% 60% at 100% 110%, var(--bg-glow-2) 0%, transparent 65%),
    repeating-linear-gradient(115deg, rgba(255, 255, 255, .014) 0 1px, transparent 1px 3px);
  background-attachment: fixed;
}

body.sheet-open { overflow: hidden; }

button, input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button { cursor: pointer; border: 0; background: none; }
button:disabled { opacity: .45; cursor: default; }

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  margin: 0;
  letter-spacing: .01em;
}

p { margin: 0; }
a { color: var(--gold-soft); }

svg { display: block; }

/* ---------- App shell ---------- */
.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  isolation: isolate;
}

@media (min-width: 520px) {
  .app {
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255, 255, 255, .012), transparent 30%);
  }
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  padding: calc(var(--safe-t) + 8px) 14px 9px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--line);
}

.topbar::after {
  content: "";
  position: absolute;
  left: 12%;
  right: 12%;
  bottom: -1px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
}

.world-switch {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 8px 5px 5px;
  border-radius: 12px;
  text-align: left;
  min-height: 44px;
}

.world-switch:active { background: rgba(212, 175, 55, .08); }

.world-switch__sigil {
  width: 34px;
  height: 34px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--gold);
  background: radial-gradient(circle at 35% 30%, rgba(212, 175, 55, .22), transparent 70%);
  border: 1px solid var(--line-strong);
}

.world-switch__text { min-width: 0; }

.world-switch__name {
  display: block;
  font-family: var(--font-display);
  font-size: 15.5px;
  letter-spacing: .02em;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 190px;
}

.world-switch__sub {
  display: block;
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-top: 1px;
}

.topbar__actions { display: flex; gap: 2px; flex: none; }

.icon-btn {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: var(--text-dim);
  transition: background .18s, color .18s, transform .18s;
}

.icon-btn:active { transform: scale(.94); background: rgba(212, 175, 55, .12); }
.icon-btn.is-gold { color: var(--gold); }
.icon-btn svg { width: 21px; height: 21px; }

/* ---------- Main / views ---------- */
main {
  padding: 14px 16px calc(var(--nav-h) + var(--safe-b) + 26px);
  min-height: 60vh;
}

.view { display: none; }
.view.is-active { display: block; animation: viewIn .28s var(--ease); }

@keyframes viewIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin: 18px 2px 10px;
}

.section-head:first-child { margin-top: 4px; }

.section-head h2 {
  font-size: 17px;
  letter-spacing: .04em;
}

.section-head .eyebrow {
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--muted);
  display: block;
  margin-bottom: 2px;
  font-family: var(--font-body);
}

.section-head__link {
  font-size: 12px;
  color: var(--gold);
  padding: 6px;
  margin: -6px;
}

/* ---------- Hero ---------- */
.hero {
  position: relative;
  padding: 22px 20px 18px;
  border-radius: var(--r-lg);
  background:
    radial-gradient(140% 100% at 0% 0%, rgba(212, 175, 55, .16), transparent 55%),
    linear-gradient(165deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow), inset 0 0 0 1px rgba(0, 0, 0, .25);
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid var(--line);
  border-radius: calc(var(--r-lg) - 6px);
  pointer-events: none;
}

.hero::after {
  content: "✦";
  position: absolute;
  right: 16px;
  top: 12px;
  color: var(--gold);
  opacity: .6;
  font-size: 13px;
}

.hero__eyebrow {
  font-size: 10px;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}

.hero h1 {
  font-size: 26px;
  line-height: 1.24;
  color: var(--text);
  text-shadow: 0 1px 0 rgba(0, 0, 0, .3);
}

.hero__tagline {
  font-family: var(--font-display);
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--gold-soft);
  margin-top: 8px;
}

.hero__desc {
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-dim);
  margin-top: 10px;
}

.hero__divider {
  height: 1px;
  margin: 14px 0 12px;
  background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
}

.hero__stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.stat {
  padding: 7px 4px;
  text-align: center;
  border-radius: 10px;
  background: rgba(212, 175, 55, .05);
  border: 1px solid transparent;
}

.stat:active { border-color: var(--line-strong); }

.stat b {
  display: block;
  font-family: var(--font-display);
  font-size: 18px;
  color: var(--gold-soft);
  line-height: 1.2;
}

.stat span {
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: .04em;
}

/* ---------- Quick actions ---------- */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.quick {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 7px;
  padding: 12px 10px;
  min-height: 84px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text-dim);
  text-align: left;
  transition: transform .16s var(--ease), border-color .16s;
}

.quick:active { transform: translateY(1px) scale(.985); border-color: var(--line-strong); }

.quick svg { width: 19px; height: 19px; color: var(--gold); }
.quick span { font-size: 11.5px; line-height: 1.3; letter-spacing: .01em; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px;
}

.card--parchment {
  background:
    linear-gradient(170deg, rgba(255, 255, 255, .6), rgba(0, 0, 0, 0) 55%),
    var(--surface);
}

.list { display: flex; flex-direction: column; gap: 9px; }

.row-card {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 13px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  text-align: left;
  transition: border-color .16s, transform .16s;
}

.row-card:active { border-color: var(--line-strong); transform: scale(.995); }

.row-card__badge {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 15px;
  color: var(--gold-soft);
  background: rgba(212, 175, 55, .09);
  border: 1px solid var(--line);
}

.row-card__body { flex: 1; min-width: 0; }

.row-card__title {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.row-card__meta {
  display: block;
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.row-card__chev { color: var(--muted); flex: none; }
.row-card__chev svg { width: 16px; height: 16px; }

/* ---------- Character grid ---------- */
.char-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 11px;
}

.char-card {
  position: relative;
  display: flex;
  flex-direction: column;
  border-radius: var(--r-md);
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--line);
  text-align: left;
  transition: transform .16s var(--ease), border-color .16s;
}

.char-card:active { transform: scale(.98); border-color: var(--line-strong); }

.char-card__portrait {
  position: relative;
  aspect-ratio: 1 / 1;
  background: linear-gradient(160deg, #2e2418, #191310);
  display: grid;
  place-items: center;
  overflow: hidden;
}

.char-card__portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;   /* 인물 얼굴·상반신이 잘리지 않게 */
  display: block;
}

.char-card__initial {
  font-family: var(--font-display);
  font-size: 34px;
  color: rgba(212, 175, 55, .55);
  letter-spacing: .02em;
}

.char-card__portrait::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 55%, rgba(12, 9, 7, .82));
  pointer-events: none;
}

.char-card__race {
  position: absolute;
  left: 8px;
  top: 8px;
  z-index: 2;
  font-size: 9.5px;
  letter-spacing: .05em;
  padding: 3px 7px;
  border-radius: 999px;
  color: var(--gold-soft);
  background: rgba(12, 9, 7, .6);
  border: 1px solid rgba(212, 175, 55, .3);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  max-width: calc(100% - 16px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.char-card__body { padding: 8px 10px 11px; }

.char-card__name {
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.char-card__title {
  font-size: 10.5px;
  color: var(--gold-soft);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.char-card__faction {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- Search & chips ---------- */
.toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}

.search {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  height: 44px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}

.search svg { width: 17px; height: 17px; color: var(--muted); flex: none; }

.search input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  outline: none;
  font-size: 16px;
  color: var(--text);
}

.search input::placeholder { color: var(--muted); }

.chip-row {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 2px 2px 8px;
  margin: 0 -2px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.chip-row::-webkit-scrollbar { display: none; }

.chip {
  flex: none;
  height: 32px;
  padding: 0 13px;
  border-radius: 999px;
  font-size: 12.5px;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--line);
  white-space: nowrap;
  transition: background .16s, color .16s, border-color .16s;
}

.chip--active {
  color: var(--ink);
  background: linear-gradient(180deg, var(--gold-soft), var(--gold));
  border-color: var(--gold);
  font-weight: 600;
}

.chip--small { height: 28px; font-size: 11.5px; padding: 0 11px; }

.label-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 14px 2px 6px;
  font-size: 10.5px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
}

.mini-chips { display: flex; flex-wrap: wrap; gap: 5px; }

.mini-chip {
  font-size: 10.5px;
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(212, 175, 55, .07);
  border: 1px solid var(--line);
  color: var(--text-dim);
}

/* ---------- Empty state ---------- */
.empty {
  padding: 38px 20px;
  text-align: center;
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-lg);
  background: rgba(212, 175, 55, .03);
}

.empty__sigil {
  font-size: 22px;
  color: var(--gold);
  opacity: .7;
  margin-bottom: 10px;
}

.empty h3 { font-size: 15px; margin-bottom: 6px; }
.empty p { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.empty .btn { margin-top: 14px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 46px;
  padding: 0 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .01em;
  color: var(--text);
  background: var(--surface-3);
  border: 1px solid var(--line);
  transition: transform .16s var(--ease), filter .16s;
}

.btn:active { transform: scale(.98); }
.btn svg { width: 17px; height: 17px; }

.btn--gold {
  color: #1a1412;
  background: linear-gradient(175deg, #f0d781 0%, var(--gold) 55%, #b08c22 100%);
  border-color: rgba(255, 240, 190, .5);
  box-shadow: 0 6px 18px rgba(190, 150, 40, .25), inset 0 1px 0 rgba(255, 255, 255, .45);
}

.btn--ghost { background: transparent; }
.btn--danger { color: var(--danger); border-color: rgba(200, 90, 100, .35); background: rgba(200, 90, 100, .06); }
.btn--sm { min-height: 38px; padding: 0 13px; font-size: 12.5px; border-radius: 10px; }
.btn--block { width: 100%; }
.btn--icon { padding: 0; width: 46px; }

.btn-row { display: flex; gap: 8px; }
.btn-row > * { flex: 1; }

/* ---------- FAB ---------- */
.fab {
  position: fixed;
  right: max(16px, calc((100vw - 480px) / 2 + 16px));
  bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
  width: 54px;
  height: 54px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #1a1412;
  background: linear-gradient(170deg, #f2dc94, var(--gold) 60%, #ac8820);
  border: 1px solid rgba(255, 245, 200, .55);
  box-shadow: 0 10px 26px rgba(0, 0, 0, .45), 0 0 0 4px rgba(212, 175, 55, .08);
  z-index: 45;
  transition: transform .18s var(--ease);
}

.fab:active { transform: scale(.93); }
.fab svg { width: 24px; height: 24px; }
.fab[hidden] { display: none; }

/* ---------- Bottom nav ---------- */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  align-items: center;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(1.25);
  backdrop-filter: blur(18px) saturate(1.25);
  border-top: 1px solid var(--line);
  padding-inline: 4px;
}

@media (min-width: 520px) {
  .tabbar {
    max-width: 480px;
    margin: 0 auto;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
}

.tabbar::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 15%;
  right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
}

.tab {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--muted);
  font-size: 9.5px;
  letter-spacing: .02em;
  transition: color .18s;
}

.tab svg { width: 21px; height: 21px; }
.tab.is-active { color: var(--gold); }

.tab.is-active::after {
  content: "";
  position: absolute;
  top: 5px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 8px var(--gold);
}

.tab:active { color: var(--gold-soft); }

/* ---------- Sheets ---------- */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(6, 4, 3, .6);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity .26s ease;
  z-index: 60;
}

.sheet-backdrop.is-open { opacity: 1; }

.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 61;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  max-height: 92vh;
  max-height: 92dvh;
  border-radius: 22px 22px 0 0;
  background: linear-gradient(180deg, var(--surface-3) 0%, var(--surface) 42%, var(--bg) 100%);
  border: 1px solid var(--line-strong);
  border-bottom: 0;
  box-shadow: 0 -20px 50px rgba(0, 0, 0, .5);
  transform: translateY(102%);
  transition: transform .34s var(--ease);
  padding-bottom: var(--safe-b);
}

.sheet.is-open { transform: none; }
.sheet--full { height: 91vh; height: 91dvh; }

/* 이름·칭호를 본문 프로필 블록이 대신 쓰는 시트 — 닫기 버튼만 남긴다 */
.sheet__head--plain { justify-content: flex-end; padding-bottom: 6px; }

.sheet__grab {
  padding: 9px 0 3px;
  display: grid;
  place-items: center;
  flex: none;
}

.sheet__grab::before {
  content: "";
  width: 38px;
  height: 4px;
  border-radius: 999px;
  background: var(--line-strong);
}

.sheet__head {
  flex: none;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 2px 18px 12px;
  border-bottom: 1px solid var(--line);
}

.sheet__head-text { flex: 1; min-width: 0; }

.sheet__eyebrow {
  font-size: 9.5px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 3px;
}

.sheet__title {
  font-size: 19px;
  line-height: 1.3;
  color: var(--text);
}

.sheet__sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
}

.sheet__close {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--text-dim);
  background: rgba(127, 127, 127, .12);
  margin-top: 2px;
}

.sheet__close svg { width: 15px; height: 15px; }

.sheet__body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 18px 22px;
  overscroll-behavior: contain;
}

.sheet__foot {
  flex: none;
  display: flex;
  gap: 8px;
  padding: 10px 18px 12px;
  border-top: 1px solid var(--line);
  background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .18));
}

.sheet__foot > * { flex: 1; }

/* ---------- Forms ---------- */
.field { display: block; margin-bottom: 13px; }

.field__label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 10.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}

.field__label b { color: var(--gold); font-weight: 600; }

.input, .textarea, .select {
  display: block;
  width: 100%;
  padding: 11px 13px;
  min-height: 46px;
  border-radius: 11px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 16px;
  outline: none;
  transition: border-color .16s, box-shadow .16s;
}

.textarea { min-height: 88px; resize: vertical; line-height: 1.6; font-size: 15px; }

.input:focus, .textarea:focus, .select:focus {
  border-color: var(--line-strong);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, .10);
}

.input::placeholder, .textarea::placeholder { color: var(--muted); }

.field--slim { display: flex; gap: 9px; }
.field--slim > * { flex: 1; }

.field-hint { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.5; }

.input-with-action { display: flex; gap: 6px; align-items: stretch; }
.input-with-action .input { flex: 1; min-width: 0; }

.mini-action {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0 11px;
  min-height: 46px;
  border-radius: 11px;
  font-size: 12px;
  font-weight: 600;
  color: var(--gold-soft);
  background: rgba(212, 175, 55, .08);
  border: 1px solid var(--line-strong);
}

.mini-action:active { background: rgba(212, 175, 55, .18); }
.mini-action svg { width: 14px; height: 14px; }

.picker { display: flex; flex-wrap: wrap; gap: 6px; }

.swatch-row { display: flex; gap: 8px; }

/* ---------- Image drop ---------- */
.img-drop {
  position: relative;
  border-radius: var(--r-md);
  border: 1px dashed var(--line-strong);
  background: var(--surface-2);
  min-height: 120px;
  display: grid;
  place-items: center;
  gap: 6px;
  padding: 14px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  overflow: hidden;
}

.img-drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; }

.img-drop__inner { position: relative; z-index: 2; display: grid; gap: 5px; justify-items: center; }
.img-drop.has-img .img-drop__inner { display: none; }
.img-drop svg { width: 22px; height: 22px; color: var(--gold); opacity: .8; }

.img-drop__actions {
  position: absolute;
  z-index: 3;
  right: 8px;
  bottom: 8px;
  display: flex;
  gap: 6px;
}

.img-drop__actions .btn {
  min-height: 34px;
  padding: 0 11px;
  font-size: 11.5px;
  background: rgba(10, 8, 6, .72);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  color: var(--parchment);
  border-color: rgba(212, 175, 55, .35);
}

/* ---------- Detail sheet bits ---------- */
.detail-hero {
  position: relative;
  border-radius: var(--r-md);
  overflow: hidden;
  border: 1px solid var(--line);
  aspect-ratio: 16 / 10;
  background: linear-gradient(150deg, #33281a, #15100c);
  display: grid;
  place-items: center;
  margin-bottom: 14px;
}

.detail-hero img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }

.detail-hero__initial {
  font-family: var(--font-display);
  font-size: 60px;
  color: rgba(212, 175, 55, .35);
}

.detail-hero::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 -70px 60px -30px rgba(0, 0, 0, .7);
  pointer-events: none;
}

/* ---------- 인물 상세 맨 위 프로필 (사진 + 이름·칭호·성별·종족) ---------- */
.char-profile {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 2px 0 14px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.char-profile__media { flex: none; width: 96px; display: grid; gap: 7px; }

.char-profile__photo {
  position: relative;
  width: 96px;
  height: 96px;
  padding: 0;
  margin: 0;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  background: linear-gradient(160deg, #33281a, #17110d);
  display: grid;
  place-items: center;
  box-shadow: var(--shadow-sm);
}

.char-profile__photo.has-img { transition: transform .16s var(--ease); }
.char-profile__photo.has-img:active { transform: scale(.97); }

.char-profile__photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;   /* 머리·얼굴이 잘리지 않게 */
  display: block;
}

.char-profile__initial {
  font-family: var(--font-display);
  font-size: 38px;
  color: rgba(212, 175, 55, .5);
}

.char-profile__lens {
  position: absolute;
  right: 6px;
  bottom: 6px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 11px;
  line-height: 1;
  background: rgba(10, 8, 6, .72);
  border: 1px solid rgba(212, 175, 55, .4);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}

.char-profile__zoom {
  min-height: 30px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--gold-soft);
  background: rgba(212, 175, 55, .1);
  border: 1px solid var(--line-strong);
}

.char-profile__zoom:active { background: rgba(212, 175, 55, .2); }

.char-profile__id { flex: 1; min-width: 0; padding-top: 1px; }

.char-profile__eyebrow {
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 3px;
}

.char-profile__name {
  font-size: 21px;
  line-height: 1.28;
  color: var(--text);
  word-break: break-word;
}

.char-profile__title {
  margin-top: 3px;
  font-size: 12.5px;
  line-height: 1.4;
  color: var(--gold-soft);
}

.char-profile__chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.char-profile__chips .mini-chip { font-size: 10px; }

.char-profile__body {
  margin-top: 6px;
  font-size: 11.5px;
  letter-spacing: .02em;
  color: var(--muted);
}

@media (max-width: 360px) {
  .char-profile { gap: 11px; }
  .char-profile__media, .char-profile__photo { width: 86px; }
  .char-profile__photo { height: 86px; }
  .char-profile__name { font-size: 19px; }
}

.def-list { display: grid; gap: 9px; }

.def {
  display: grid;
  grid-template-columns: 76px 1fr;
  gap: 10px;
  font-size: 13px;
  line-height: 1.6;
}

.def dt { color: var(--muted); font-size: 11px; letter-spacing: .08em; padding-top: 2px; }
.def dd { margin: 0; color: var(--text-dim); white-space: pre-wrap; }

.prose { font-size: 13.5px; line-height: 1.75; color: var(--text-dim); white-space: pre-wrap; }

.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
  margin: 16px 0;
}

.rel-line {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 11px;
  border-radius: 11px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  width: 100%;
  text-align: left;
  font-size: 12.5px;
  color: var(--text-dim);
}

.rel-line:active { border-color: var(--line-strong); }
.rel-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.rel-line b { color: var(--text); font-weight: 600; }
.rel-line .rel-type { margin-left: auto; font-size: 10.5px; color: var(--muted); flex: none; }

/* ---------- Status pills ---------- */
.status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--text-dim);
  background: var(--surface-2);
  white-space: nowrap;
}

.status--idea { color: #c9a84a; border-color: rgba(201, 168, 74, .35); background: rgba(201, 168, 74, .1); }
.status--writing { color: #7fa9c9; border-color: rgba(127, 169, 201, .35); background: rgba(127, 169, 201, .1); }
.status--done { color: var(--ok); border-color: rgba(127, 176, 139, .35); background: rgba(127, 176, 139, .1); }

/* ---------- Relationship graph ---------- */
.graph-wrap {
  position: relative;
  height: calc(100vh - var(--top-h) - var(--nav-h) - 128px);
  height: calc(100dvh - var(--top-h) - var(--nav-h) - 128px);
  min-height: 330px;
  border-radius: var(--r-lg);
  overflow: hidden;
  border: 1px solid var(--line);
  background:
    radial-gradient(70% 50% at 50% 40%, rgba(212, 175, 55, .07), transparent 70%),
    var(--surface-2);
  touch-action: none;
}

.graph-wrap::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(212, 175, 55, .055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212, 175, 55, .055) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
}

#graph-svg { width: 100%; height: 100%; position: absolute; inset: 0; }
#faction-svg { width: 100%; height: 100%; position: absolute; inset: 0; cursor: grab; }
#faction-svg:active { cursor: grabbing; }
.fedge line { transition: stroke-opacity .15s; }
.fnode { cursor: grab; }
.fnode text { pointer-events: none; user-select: none; -webkit-user-select: none; }
.fnode.is-selected circle { stroke: var(--gold); }

/* 인물/세력 관계도 세그먼트 */
.segmented {
  display: flex;
  gap: 4px;
  padding: 3px;
  margin: 2px 0 10px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}

.seg {
  flex: 1;
  height: 34px;
  border-radius: 9px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  background: transparent;
  border: 0;
}

.seg.is-on {
  color: var(--ink);
  background: linear-gradient(180deg, var(--gold-soft), var(--gold));
  box-shadow: 0 2px 8px rgba(0, 0, 0, .22);
}

/* 인물 상세 — 연결된 관계 카드 */
.rel-cards { display: grid; gap: 7px; }

.rel-card {
  display: flex;
  align-items: stretch;
  gap: 6px;
}

.rel-card__who {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: 12px;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--rel-color, var(--gold));
}

.rel-card__face {
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  font-size: 11px;
  color: var(--gold-soft);
  background: var(--surface-2);
  border: 1px solid var(--line-strong);
}

.rel-card__face img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.rel-card__txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.rel-card__txt b { font-size: 12.5px; color: var(--text); }
.rel-card__label { font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel-card__type { flex: none; font-size: 10px; color: var(--rel-color, var(--gold-soft)); }

.rel-card__edit {
  flex: none;
  width: 34px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
}

.rel-card__edit svg { width: 14px; height: 14px; }

/* 연표 연도 스텝퍼 */
.year-stepper {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
}

.ystep {
  flex: none;
  height: 38px;
  min-width: 34px;
  padding: 0 7px;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}

.ystep:active { transform: scale(.94); }
.year-input { flex: 1; min-width: 0; height: 38px; text-align: center; font-size: 15px; font-weight: 600; }

.graph-toolbar {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 0 0 10px;
  scrollbar-width: none;
  align-items: center;
}

.graph-toolbar::-webkit-scrollbar { display: none; }

.gbtn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 36px;
  padding: 0 12px;
  border-radius: 10px;
  font-size: 12px;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--line);
  white-space: nowrap;
}

.gbtn svg { width: 15px; height: 15px; }
.gbtn.is-on { color: var(--ink); background: linear-gradient(180deg, var(--gold-soft), var(--gold)); border-color: var(--gold); font-weight: 600; }
.gbtn--icon { width: 36px; padding: 0; justify-content: center; }

.graph-hint {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 10px;
  z-index: 3;
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--gold-soft);
  background: rgba(10, 8, 6, .78);
  border: 1px solid var(--line-strong);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  text-align: center;
  pointer-events: none;
  transition: opacity .2s;
}

.graph-legend {
  position: absolute;
  left: 10px;
  top: 10px;
  z-index: 3;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  max-width: 62%;
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 9.5px;
  color: var(--parchment);
  background: rgba(10, 8, 6, .66);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}

.graph-legend span { display: inline-flex; align-items: center; gap: 4px; }
.graph-legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

/* ---------- Map ---------- */
.map-toolbar {
  display: flex;
  gap: 7px;
  margin-bottom: 10px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.map-toolbar::-webkit-scrollbar { display: none; }
.map-toolbar .gbtn { flex: none; }
.gbtn__emoji { font-size: 13px; line-height: 1; }

.map-frame {
  position: relative;
  width: 100%;
  /* JS가 업로드한 이미지의 실제 비율(width/height)로 덮어쓴다. */
  aspect-ratio: 3 / 4;
  border-radius: var(--r-lg);
  overflow: hidden;
  border: 1px solid var(--line-strong);
  background: var(--map-bg);
  box-shadow: var(--shadow-sm);
  touch-action: pan-y;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* 확대해 둔 동안에는 한 손가락 팬을 직접 다루므로 페이지 스크롤을 잠근다 */
.map-frame.is-zoomed { touch-action: none; }

/* 지도 + 핀 + 지형 + 여정을 함께 담는 확대/이동 레이어 */
.map-stage {
  position: absolute;
  inset: 0;
  transform-origin: 0 0;
  will-change: transform;
  --mk: 1;
  --tk: 1;
}

.map-frame img.map-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
}

/* 지도 위 확대/축소 · 맞춤 단추 */
.map-zoom {
  position: absolute;
  right: 8px;
  bottom: 8px;
  z-index: 8;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.mz {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 10px;
  color: var(--parchment);
  background: rgba(14, 10, 8, .72);
  border: 1px solid rgba(212, 175, 55, .32);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  transition: transform .12s var(--ease);
}

.mz svg { width: 17px; height: 17px; }

.mz--label {
  width: 46px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
}

.mz:active { transform: scale(.94); }

.map-frame.is-zoomed .mz--label { color: var(--gold-soft); }

/* 지형 스탬프 레이어 — 지도 이미지 좌표계 위에 얹힌다 */
.map-frame .terrain-layer {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.tstamp {
  position: absolute;
  transform-origin: 50% 50%;
  transform: translate(-50%, -50%) scale(var(--tk, 1));
  display: grid;
  place-items: center;
  padding: 0;
  line-height: 0;
  border: 0;
  background: none;
  pointer-events: none;
  filter: drop-shadow(0 1px 1px rgba(30, 20, 10, .28));
  opacity: .96;
  transition: transform .14s var(--ease), opacity .14s;
}

.map-frame.is-terrain .tstamp { pointer-events: auto; }
.map-frame.is-terrain .tstamp:active { transform: translate(-50%, -50%) scale(calc(var(--tk, 1) * .88)); }
.map-frame.is-terrain .tstamp::after {
  content: "";
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  border: 1px dashed rgba(212, 175, 55, 0);
}
.tstamp__svg { display: block; width: 100%; height: 100%; }
.tstamp--s { width: 22px; height: 22px; }
.tstamp--m { width: 34px; height: 34px; }
.tstamp--l { width: 50px; height: 50px; }

.terrain-panel {
  margin: 11px 0 4px;
  padding: 11px 12px 12px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}

.terrain-panel__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.terrain-panel__title { font-size: 12.5px; font-weight: 600; color: var(--text); }
.terrain-panel__count { font-size: 11px; color: var(--muted); }

.terrain-chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.terrain-chips::-webkit-scrollbar { display: none; }

.tchip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 34px;
  padding: 0 10px 0 6px;
  border-radius: 9px;
  font-size: 11.5px;
  color: var(--text-dim);
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.tchip.is-on { color: var(--ink); background: linear-gradient(180deg, var(--gold-soft), var(--gold)); border-color: var(--gold); font-weight: 600; }
.tchip__icon { display: grid; place-items: center; width: 20px; height: 20px; }

.terrain-panel__row { display: flex; align-items: center; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
.terrain-panel__label { font-size: 11px; color: var(--muted); }
.terrain-sizes { display: flex; gap: 5px; }

.terrain-clear {
  margin-left: auto;
  height: 29px;
  padding: 0 10px;
  border-radius: 8px;
  font-size: 11px;
  color: var(--danger);
  background: rgba(200, 90, 100, .08);
  border: 1px solid rgba(200, 90, 100, .32);
}

.terrain-done {
  height: 29px;
  padding: 0 13px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink);
  background: linear-gradient(180deg, var(--gold-soft), var(--gold));
  border: 1px solid var(--gold);
}

.map-frame.is-pinning { cursor: crosshair; box-shadow: 0 0 0 2px var(--gold) inset, var(--shadow-sm); }
.map-frame.is-border, .map-frame.is-charpin { cursor: crosshair; box-shadow: 0 0 0 2px var(--gold) inset, var(--shadow-sm); }

/* 국경 그리기·인물 배치 중에는 지도 위 핀이 탭을 가로채지 않는다 */
.map-frame.is-border .pin-layer, .map-frame.is-border .cpin-layer,
.map-frame.is-charpin .pin-layer, .map-frame.is-charpin .cpin-layer { pointer-events: none; }
.map-frame.is-border .tstamp { pointer-events: none; }

.map-lock-note {
  margin: -3px 0 11px;
  padding: 7px 11px;
  border-radius: 9px;
  text-align: center;
  font-size: 10.5px;
  line-height: 1.45;
  color: var(--gold-soft);
  background: rgba(212, 175, 55, .08);
  border: 1px solid var(--line);
}

/* ---------- 국경(영토) ---------- */
.map-border-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}

.map-border__area { fill-opacity: .16; stroke: none; pointer-events: auto; }
.map-border__line { fill: none; stroke-width: 1.6; stroke-opacity: .8; stroke-linejoin: round; pointer-events: auto; }
.map-border.is-selected .map-border__line { stroke-width: 2.8; stroke-opacity: 1; }

.map-border__label {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: .02em;
  fill: #3f3324;
  text-anchor: middle;
  dominant-baseline: middle;
  paint-order: stroke;
  stroke: rgba(255, 252, 240, .72);
  stroke-width: 2.2px;
  pointer-events: none;
}

.map-border__draft { fill: rgba(212, 175, 55, .14); stroke: var(--gold); stroke-width: 2; stroke-dasharray: 4 4; }
.map-border__dot { fill: var(--gold-soft); stroke: #241a10; stroke-width: 1; }

.border-panel {
  margin: 11px 0 4px;
  padding: 11px 12px 12px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}

.border-panel__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.border-panel__title { font-size: 12.5px; font-weight: 600; color: var(--text); }
.border-panel__count { font-size: 11px; color: var(--muted); }
.border-panel__row { display: flex; gap: 7px; margin-top: 9px; }
.border-panel__row .btn { flex: 1; }

.border-colors { display: flex; flex-wrap: wrap; gap: 9px; }
.border-color {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--bc);
  border: 2px solid transparent;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25);
}
.border-color.is-on { border-color: var(--text); box-shadow: 0 0 0 3px rgba(212, 175, 55, .3); }

/* ---------- 지도 위 인물 핀 ---------- */
.cpin-layer { position: absolute; inset: 0; z-index: 4; pointer-events: none; }

.cpin {
  position: absolute;
  transform-origin: 50% 50%;
  transform: translate(-50%, -50%) scale(var(--mk, 1));
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0;
  background: none;
  pointer-events: auto;
  transition: transform .15s var(--ease);
}

.cpin:active { transform: translate(-50%, -50%) scale(calc(var(--mk, 1) * .94)); }

.cpin__face {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  place-items: center;
  background: linear-gradient(160deg, #33281a, #17110d);
  border: 2px solid var(--gold-soft);
  box-shadow: 0 2px 7px rgba(0, 0, 0, .45);
}

.cpin__face img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.cpin__initial { font-family: var(--font-display); font-size: 15px; color: var(--gold-soft); }

.cpin__label {
  margin-top: 2px;
  max-width: 92px;
  padding: 1px 5px;
  border-radius: 5px;
  font-size: 8.5px;
  color: var(--parchment);
  background: rgba(14, 10, 8, .82);
  border: 1px solid rgba(212, 175, 55, .32);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cpin__note {
  margin-top: 1px;
  max-width: 92px;
  font-size: 7.5px;
  color: var(--gold-soft);
  text-shadow: 0 1px 2px rgba(0, 0, 0, .8);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.map-frame .pin-layer { position: absolute; inset: 0; }

.pin {
  position: absolute;
  transform-origin: 50% 100%;
  transform: translate(-50%, -100%) scale(var(--mk, 1));
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0;
  z-index: 3;
  transition: transform .15s var(--ease);
}

.pin:active { transform: translate(-50%, -100%) scale(calc(var(--mk, 1) * .94)); }

.pin__mark {
  width: 21px;
  height: 21px;
  border-radius: 50% 50% 50% 4px;
  transform: rotate(-45deg);
  background: linear-gradient(150deg, #f3dc94, var(--gold) 60%, #9a7620);
  border: 1.5px solid rgba(26, 20, 18, .6);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .4);
  display: grid;
  place-items: center;
}

.pin__mark span {
  transform: rotate(45deg);
  font-size: 8.5px;
  font-weight: 700;
  color: #241a08;
}

.pin__label {
  margin-top: 2px;
  font-size: 8.8px;
  padding: 1.5px 5px;
  border-radius: 5px;
  color: var(--parchment);
  background: rgba(14, 10, 8, .72);
  border: 1px solid rgba(212, 175, 55, .25);
  max-width: 88px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pin--dungeon .pin__mark { background: linear-gradient(150deg, #c9a0e0, #6b4a8a); }
.pin--forest .pin__mark { background: linear-gradient(150deg, #a7d0a0, #3f7a52); }
.pin--mountain .pin__mark { background: linear-gradient(150deg, #d6d9dd, #7d8794); }
.pin--ruin .pin__mark { background: linear-gradient(150deg, #d8c7a5, #8a7350); }
.pin--port .pin__mark { background: linear-gradient(150deg, #9fd6e6, #3a7d96); }

.map-empty-hint {
  position: absolute;
  inset: auto auto 10px 10px;
  max-width: calc(100% - 68px);
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 11.5px;
  text-align: center;
  color: var(--parchment);
  background: rgba(12, 9, 7, .7);
  border: 1px solid var(--line-strong);
  pointer-events: none;
}

.region-card { display: flex; gap: 11px; align-items: flex-start; }

/* ---------- Timeline ---------- */
.tl { position: relative; padding-left: 22px; }

.tl::before {
  content: "";
  position: absolute;
  left: 5px;
  top: 6px;
  bottom: 6px;
  width: 1px;
  background: linear-gradient(180deg, transparent, var(--line-strong) 8%, var(--line-strong) 92%, transparent);
}

.tl-era {
  position: relative;
  margin: 18px 0 8px;
  font-family: var(--font-display);
  font-size: 12.5px;
  letter-spacing: .16em;
  color: var(--gold);
  text-transform: uppercase;
}

.tl-era:first-child { margin-top: 4px; }

.tl-era::before {
  content: "";
  position: absolute;
  left: -22px;
  top: 6px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--gold);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, .08);
}

.tl-item {
  position: relative;
  display: block;
  width: 100%;
  text-align: left;
  padding: 11px 13px;
  margin-bottom: 8px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
}

.tl-item:active { border-color: var(--line-strong); }

.tl-item::before {
  content: "";
  position: absolute;
  left: -21px;
  top: 17px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--line-strong);
}

.tl-item__year {
  font-size: 10.5px;
  letter-spacing: .1em;
  color: var(--gold);
  margin-bottom: 3px;
}

.tl-item__title {
  font-family: var(--font-display);
  font-size: 14.5px;
  color: var(--text);
  line-height: 1.35;
}

.tl-item__sum {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ---------- Lore ---------- */
.lore-card { border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); overflow: hidden; }

.lore-card__head {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  padding: 13px 14px;
  text-align: left;
}

.lore-card__cat {
  font-size: 9.5px;
  letter-spacing: .08em;
  color: var(--gold);
  margin-bottom: 4px;
}

.lore-card__title { font-family: var(--font-display); font-size: 14.5px; color: var(--text); line-height: 1.35; }

.lore-card__body {
  padding: 0 14px 14px;
  font-size: 13px;
  line-height: 1.75;
  color: var(--text-dim);
  white-space: pre-wrap;
}

.lore-card__toggle { margin-left: auto; color: var(--muted); transition: transform .2s; flex: none; }
.lore-card__toggle svg { width: 16px; height: 16px; }
.lore-card.is-open .lore-card__toggle { transform: rotate(180deg); }

.tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }

/* ---------- Episodes ---------- */
.ep-card {
  display: block;
  width: 100%;
  text-align: left;
  padding: 13px 14px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
}

.ep-card:active { border-color: var(--line-strong); }

.ep-card__top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }

.ep-card__no {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--gold);
  padding: 2px 8px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: rgba(212, 175, 55, .06);
}

.ep-card__title { font-family: var(--font-display); font-size: 15px; color: var(--text); }
.ep-card__syn { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ep-card .status { margin-left: auto; }

.scene-item {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 9px 10px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  margin-bottom: 7px;
}

.scene-item__no {
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 10px;
  color: var(--gold);
  border: 1px solid var(--line-strong);
  margin-top: 1px;
}

.scene-item__text { flex: 1; font-size: 12.5px; line-height: 1.55; color: var(--text-dim); white-space: pre-wrap; }
.scene-item__del { flex: none; color: var(--muted); padding: 2px; }
.scene-item__del svg { width: 14px; height: 14px; }

/* ---------- Generator ---------- */
.gen-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  margin-bottom: 14px;
}

.gen-tab {
  height: 38px;
  border-radius: 9px;
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.gen-tab svg { width: 15px; height: 15px; }
.gen-tab.is-active { color: var(--ink); background: linear-gradient(180deg, var(--gold-soft), var(--gold)); font-weight: 600; }

.gen-results { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }

.gen-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 11px;
  border-radius: 11px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  animation: genIn .25s var(--ease) both;
}

@keyframes genIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}

.gen-item__text { flex: 1; min-width: 0; }

.gen-item__name {
  font-family: var(--font-display);
  font-size: 14.5px;
  color: var(--text);
  line-height: 1.35;
}

.gen-item__epi { font-size: 11px; color: var(--gold-soft); margin-top: 1px; }
.gen-item__sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }

.gen-item__acts { display: flex; gap: 5px; flex: none; }

.mini-btn {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: var(--text-dim);
  background: rgba(127, 127, 127, .1);
  border: 1px solid var(--line);
}

.mini-btn:active { background: rgba(212, 175, 55, .18); color: var(--gold); }
.mini-btn svg { width: 15px; height: 15px; }
.mini-btn--gold { color: var(--ink); background: linear-gradient(180deg, var(--gold-soft), var(--gold)); border-color: var(--gold); }

/* ---------- Image lightbox (프로필 사진 크게 보기) ---------- */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  flex-direction: column;
  padding: calc(var(--safe-t) + 10px) 0 calc(var(--safe-b) + 12px);
  background: rgba(8, 6, 5, .94);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  opacity: 0;
  transition: opacity .22s ease;
  -webkit-user-select: none;
  user-select: none;
}

.lightbox.is-open { opacity: 1; }

.lightbox__bar {
  flex: none;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 4px 12px 10px 18px;
}

.lightbox__cap { flex: 1; min-width: 0; }

.lightbox__title {
  display: block;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 17px;
  line-height: 1.3;
  color: var(--parchment);
}

.lightbox__sub {
  display: block;
  margin-top: 2px;
  font-size: 11.5px;
  color: rgba(244, 235, 208, .62);
}

.lightbox__close {
  flex: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--parchment);
  background: rgba(255, 255, 255, .08);
  border: 1px solid rgba(212, 175, 55, .32);
}

.lightbox__close svg { width: 16px; height: 16px; }

.lightbox__stage {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 0 12px;
}

.lightbox__img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;      /* 위아래 잘림 없이 일러스트 원본 전체 */
  object-position: center center;
  border-radius: 10px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .6);
  background: rgba(255, 255, 255, .02);
}

.lightbox__hint {
  flex: none;
  padding-top: 10px;
  text-align: center;
  font-size: 10.5px;
  letter-spacing: .06em;
  color: rgba(244, 235, 208, .42);
}

/* ---------- Toast ---------- */
#toast-root {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(var(--nav-h) + var(--safe-b) + 18px);
  z-index: 90;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  padding: 0 24px;
}

.toast {
  max-width: 420px;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 12.5px;
  color: var(--parchment);
  background: rgba(20, 15, 12, .94);
  border: 1px solid var(--line-strong);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  animation: toastIn .24s var(--ease);
  display: flex;
  align-items: center;
  gap: 7px;
}

.toast svg { width: 15px; height: 15px; color: var(--gold); flex: none; }
.toast.is-out { animation: toastOut .24s ease forwards; }

@keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(8px) scale(.97); } }

/* ---------- Misc ---------- */
.muted { color: var(--muted); }
.small { font-size: 12px; }
.center { text-align: center; }
.mt-8 { margin-top: 8px; }
.mt-14 { margin-top: 14px; }
.hidden { display: none !important; }

.skeleton {
  height: 90px;
  border-radius: var(--r-md);
  background: linear-gradient(100deg, var(--surface) 30%, var(--surface-3) 50%, var(--surface) 70%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}

@keyframes shimmer { to { background-position: -200% 0; } }

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- Graph nodes & edges ---------- */
#graph-svg { cursor: grab; }
#graph-svg:active { cursor: grabbing; }

.gnode { cursor: grab; }
.gnode text {
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}
.gnode circle { transition: stroke-opacity .18s; }
.gnode-lbl { fill: var(--text); stroke: var(--bg); stroke-width: 2.2; paint-order: stroke; }
.gnode.is-selected circle { stroke: var(--gold); stroke-opacity: 1; }
.gedge text, .gedge rect { cursor: pointer; }
.gedge path { transition: stroke-opacity .18s; }

/* ---------- Map story journey ---------- */
.map-frame.is-story .pin:not(.pin--current):not(.pin--passed) { opacity: .55; }
.map-frame.is-story .pin__label { opacity: .9; }

.map-path-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  overflow: visible;
}

.story-path-active {
  animation: dashFlow 1.1s linear infinite;
  filter: drop-shadow(0 0 3px rgba(244, 217, 122, .75));
}

@keyframes dashFlow {
  to { stroke-dashoffset: -26; }
}

.story-badges {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
}

.story-badge {
  position: absolute;
  transform-origin: 50% 100%;
  transform: translate(-50%, calc(-52px * var(--mk, 1))) scale(var(--mk, 1));
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  font-size: 10px;
  font-weight: 700;
  color: #241a08;
  background: rgba(244, 235, 208, .92);
  border: 1px solid rgba(26, 20, 18, .5);
  box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
}

.story-badge.is-past { background: rgba(212, 175, 55, .8); }

.story-badge.is-current {
  background: linear-gradient(180deg, #ffe9a8, #d4af37);
  border-color: #fff3c4;
  animation: badgePulse 1.6s ease-in-out infinite;
}

@keyframes badgePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(244, 217, 122, .6), 0 2px 6px rgba(0, 0, 0, .35); }
  50% { box-shadow: 0 0 0 6px rgba(244, 217, 122, 0), 0 2px 6px rgba(0, 0, 0, .35); }
}

.pin { transition: transform .18s var(--ease), opacity .25s; }

.pin--current {
  z-index: 4;
  transform: translate(-50%, -100%) scale(1.12);
}

.pin--current .pin__mark {
  box-shadow: 0 0 0 4px rgba(244, 217, 122, .28), 0 0 16px rgba(244, 217, 122, .8), 0 3px 8px rgba(0, 0, 0, .4);
  border-color: #fff3c4;
}

.pin--current .pin__label {
  border-color: var(--gold);
  color: #fff6da;
}

.pin--passed { opacity: .75; }

.story-card {
  margin-top: 12px;
  padding: 13px 14px 12px;
  border-radius: var(--r-lg);
  background:
    radial-gradient(120% 100% at 0% 0%, rgba(212, 175, 55, .14), transparent 60%),
    var(--surface);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-sm);
}

.story-card__top {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 8px;
}

.story-card__place {
  flex: 1;
  min-width: 0;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.story-card__title {
  font-size: 17px;
  line-height: 1.35;
  color: var(--text);
}

.story-card__sum {
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--text-dim);
  margin-top: 9px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.story-card__chars { margin-top: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.story-card__chars::-webkit-scrollbar { display: none; }

.story-controls {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 9px;
}

.story-slider {
  flex: 1;
  display: flex;
  align-items: center;

(function (global) {

  }

    const d = new Date();

    const node = document.createElement('div');
    node.className = 'toast';
    node.innerHTML = '<svg><use href="#' + ((opts && opts.icon) || 'i-check') + '"/></svg><span></span>';

  /* ---------------- Sheets ---------------- */
  const sheetStack = [];
  let lightboxOpen = 0;   // 라이트박스가 떠 있는 동안 시트의 ESC 닫기를 막는다

    const o = opts || {};

            (o.eyebrow ? '<div class="sheet__eyebrow">' + esc(o.eyebrow) + '</div>' : '') +
            '<h2 class="sheet__title"></h2>' +

      (o.foot ? '<div class="sheet__foot"></div>' : '');

      if (closed) return;

    const head = sheet.querySelector('.sheet__head');

      zone.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; }, { passive: true });

        if (startY === null) return;

    });

    if (o.foot) {
      const foot = sheet.querySelector('.sheet__foot');
      o.foot.forEach((btn) => {
        if (!btn) return;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn ' + (btn.className || '');
        if (btn.icon) b.innerHTML = '<svg><use href="#' + btn.icon + '"/></svg>';
        if (btn.label && btn.icon) b.insertAdjacentHTML('beforeend', '<span>' + esc(btn.label) + '</span>');

  function confirmSheet(opts) {
    return new Promise((resolve) => {
      let decided = false;
      const body = document.createElement('div');
      body.className = 'prose';
      body.style.fontSize = '13.5px';
      body.textContent = opts.message || '';
      const h = openSheet({

      return { name: sur + given, sub: '성 + 두 글자 이름', epithet: pick(EPITHET.eastern), style };
    }
    if (style === 'nordic') {
      const given = pick(GIVEN.nordic);
      const form = Math.random();
      if (form < 0.55) {
        const house = pick(HOUSE.nordic);
        return { name: given + ' ' + house, sub: '이름 + 가문', epithet: pick(EPITHET.nordic), style };
      }
      if (form < 0.8) {
        const father = pick(GIVEN.nordic);
        return { name: given + ' ' + father.replace(/르$/, '르') + '손', sub: '이름 + 부칭(~의 아들)', epithet: pick(EPITHET.nordic), style };
      }
      return { name: given, sub: '단일 이름', epithet: pick(EPITHET.nordic), style };
    }
    if (style === 'mythic') {
      const given = pick(GIVEN.mythic);
      if (chance(0.35)) {
        return { name: given + ' ' + pick(['아르', '벨', '자르', '오르']) + pick(['가르', '투스', '멜', '니스']), sub: '고대식 두 마디 이름', epithet: pick(EPITHET.mythic), style };
      }
      return { name: given, sub: '고대 왕조식 이름', epithet: pick(EPITHET.mythic), style };
    }
    const given = pick(GIVEN.western);
    const form = Math.random();
    if (form < 0.6) {
      const house = pick(HOUSE.western);
      return { name: given + ' ' + house, sub: '이름 + 가문', epithet: pick(EPITHET.western), style };
    }
    if (form < 0.78) {
      return { name: given + ' 경', sub: '이름 + 작위', epithet: pick(EPITHET.western), style };
    }
    return { name: given, sub: '이름만', epithet: pick(EPITHET.western), style };
  }

  function genNames(style, count, withEpithet) {
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < (count || 8) && guard < 200) {
      guard++;
      const item = makeName(style || 'western');
      if (seen.has(item.name)) continue;
      seen.add(item.name);
      if (!withEpithet) item.epithet = '';
      out.push(item);
    }
    return out;
  }

  function genPlaces(type, count) {
    const conf = PLACE[type] || PLACE.kingdom;
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < (count || 8) && guard < 240) {
      guard++;
      let name = '';
      const r = Math.random();
      if (type === 'eastern') {
        if (r < 0.42) {
          name = pick(conf.curated);
        } else {
          const a = pick(conf.roots);
          let b = pick(conf.noun);
          if (a === b) b = pick(conf.noun.filter((x) => x !== a));
          const t = pick(conf.types);
          name = r < 0.72 ? a + b + t : a + t;
        }
      } else if (type === 'kingdom') {
        if (r < 0.4) name = pick(conf.roots) + ' ' + pick(conf.types);
        else if (r < 0.7) name = pick(conf.adj) + ' ' + pick(conf.noun) + '의 ' + pick(conf.types);
        else name = pick(conf.adj) + pick(conf.roots);
      } else if (type === 'city') {
        if (r < 0.45) name = pick(conf.roots) + ' ' + pick(conf.types);
        else if (r < 0.75) name = pick(conf.adj) + ' ' + pick(conf.noun) + ' ' + pick(conf.types);
        else name = pick(conf.adj) + pick(conf.roots);
      } else if (type === 'nature') {
        if (r < 0.55) name = pick(conf.adj) + ' ' + pick(conf.noun);
        else if (r < 0.8) name = pick(conf.adj) + pick(conf.noun);
        else name = pick(conf.roots) + '의 ' + pick(conf.noun);
      } else {
        if (r < 0.5) name = pick(conf.adj) + ' ' + pick(conf.noun) + ' ' + pick(conf.types);
        else if (r < 0.8) name = pick(conf.noun) + '의 ' + pick(conf.types);
        else name = pick(conf.roots) + ' ' + pick(conf.types);
      }
      if (seen.has(name)) continue;
      seen.add(name);
      out.push({ name, sub: pick(conf.subs), type });
    }
    return out;
  }

  function genLore(category, count) {
    const key = LORE[category] ? category : 'faction';
    // 옛 '세력·국가' 값이 들어와도 세력으로 처리한다
    const conf = LORE[key];
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < (count || 8) && guard < 260) {
      guard++;
      let name = '';
      const r = Math.random();
      if (key === 'nation') {
        if (r < 0.45) name = pick(conf.adj) + ' ' + pick(conf.noun);
        else if (r < 0.7) name = pick(conf.adj) + pick(conf.noun);
        else if (r < 0.88) name = pick(conf.adj) + '의 ' + pick(conf.noun);
        else name = pick(conf.adj);
      } else if (key === 'faction') {
        if (r < 0.5) name = pick(conf.adj) + ' ' + pick(conf.noun);
        else if (r < 0.74) name = pick(conf.adj) + pick(conf.noun);
        else if (r < 0.9) name = pick(conf.adj) + '의 ' + pick(conf.noun);
        else name = pick(conf.noun);
      } else if (key === 'race') {
        if (r < 0.55) name = pick(conf.lead) + pick(conf.tail);
        else if (r < 0.8) name = pick(conf.lead) + ' ' + pick(conf.tail);
        else name = pick(conf.lead) + '의 ' + pick(conf.tail);
      } else if (key === 'item') {
        if (r < 0.34) name = pick(conf.adj) + pick(conf.type) + ' 「' + pick(conf.name) + '」';
        else if (r < 0.62) name = pick(conf.adj) + pick(conf.type);
        else if (r < 0.86) name = pick(conf.adj) + ' ' + pick(conf.type);
        else name = pick(conf.name) + '의 ' + pick(conf.type);
      } else if (key === 'rank') {
        if (r < 0.62) name = pick(conf.lead) + ' ' + pick(conf.tail);
        else name = pick(conf.lead) + '의 ' + pick(conf.tail);
      } else {
        if (r < 0.55) name = pick(conf.lead) + pick(conf.tail);
        else name = pick(conf.lead) + '의 ' + pick(conf.tail);
      }
      if (seen.has(name)) continue;
      seen.add(name);
      out.push({ name: name, sub: pick(conf.subs), type: key });
    }
    return out;
  }

        '<div class="gen-item__text">' +

        b.className = 'chip chip--small' + (it.value === current ? ' chip--active' : '');
        b.textContent = it.label;
        b.addEventListener('click', () => {
          if (state.mode === 'character') state.style = it.value;
          else if (state.mode === 'lore') state.loreCat = it.value;
          else state.placeType = it.value;
          draw();
          U.haptic(6);
        });
        chips.appendChild(b);
      });

      if (state.mode === 'character') {
        const toggle = body.querySelector('#gen-epithet-toggle');
        toggle.addEventListener('click', () => {
          state.withEpithet = !state.withEpithet;
          draw();
        });
      }

      const resHost = body.querySelector('#gen-results');
      const onPick = o.onPick ? (item) => { o.onPick(item); handle.close(); } : null;
      renderResults(resHost, onPick, state.mode);

      body.querySelector('#gen-again').addEventListener('click', () => {
        refresh();
        renderResults(resHost, onPick, state.mode);
        U.haptic(10);
      });

      body.querySelectorAll('[data-mode]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mode = btn.dataset.mode;
          draw();
        });
      });
    }

    draw();

    const handle = U.openSheet({
      eyebrow: '이름 공방 · NAME FORGE',
      title: state.mode === 'place' ? '지명 추천' : (state.mode === 'lore' ? (state.loreCat === 'nation' ? '국가 이름 추천' : '설정 이름 추천') : '이름 추천'),
      sub: o.contextLabel || '클릭해서 복사하거나 폼에 바로 넣으세요',
      body: body,
      foot: [{ label: '다시 뽑기', icon: 'i-refresh', className: 'btn--gold', onClick: () => {
        const again = body.querySelector('#gen-again');
        if (again) again.click();
      } }]
    });
    return handle;
  }

  function scanEn(text, table, limit) {
    const src = String(text || '');
    if (!src) return [];
    const out = [];
    table.forEach((pair) => {
      if (out.length >= (limit || 3)) return;
      if (src.indexOf(pair[0]) > -1 && out.indexOf(pair[1]) === -1) out.push(pair[1]);
    });
    return out.slice(0, limit || 3);
  }

  function raceEn(race) {
    const key = String(race || '').trim();
    if (!key) return 'humanoid';
    if (RACE_EN[key]) return RACE_EN[key];
    const hit = Object.keys(RACE_EN).find((k) => key.indexOf(k) > -1);
    if (hit) return RACE_EN[hit];
    if (/^[\x20-\x7E]+$/.test(key)) return key.toLowerCase();
    return 'fantasy humanoid';
  }

  function agePhrase(age) {
    if (age === null || age === undefined || age === '') return '';
    const m = String(age).match(/(\d{1,4})/);
    if (!m) return '';
    const n = Number(m[1]);
    if (!n || n > 400) return '';
    if (n < 16) return 'young adolescent';
    if (n < 25) return 'young adult';
    if (n < 40) return 'adult in their prime';
    if (n < 60) return 'seasoned middle-aged';
    if (n < 120) return 'elder';
    return 'ancient long-lived being';
  }

  // 성별: 여성 → female, 남성 → male. '기타/미상'이나 빈 값은 프롬프트에 넣지 않는다.
  function genderEn(raw) {
    const s = String(raw || '').trim().toLowerCase();
    if (!s) return '';
    if (/여|녀|female|woman|girl|f$|^f\b/.test(s)) return 'female';
    if (/남|male|man\b|boy|^m\b/.test(s)) return 'male';
    if (/nonbinary|non-binary|논바이너리/.test(s)) return 'androgynous';
    return '';
  }

  function nameForPrompt(name) {
    const s = String(name || '').trim();
    if (!s) return '';
    return /^[\x20-\x7E]+$/.test(s) ? s : '';
  }

  // 인물 세부정보 → 영어 판타지 일러스트 프롬프트
  function bodyPhrase(cm, kg) {
    const h = Number(cm) || 0, w = Number(kg) || 0;
    if (!h && !w) return '';
    const bits = [];
    if (h) bits.push(h >= 190 ? 'very tall stature' : (h >= 178 ? 'tall stature' : (h <= 158 ? 'petite stature' : 'average height')));
    if (h && w) {
      const bmi = w / Math.pow(h / 100, 2);
      bits.push(bmi < 18.5 ? 'slender build' : (bmi < 23 ? 'athletic build' : (bmi < 27 ? 'sturdy broad build' : 'heavyset powerful build')));
    } else if (w) {
      bits.push(w >= 95 ? 'heavy build' : (w <= 50 ? 'slim build' : 'average build'));
    }
    return bits.join(', ');
  }

  function buildPortraitPrompt(fields) {
    const f = fields || {};
    const parts = [];

    // 성별을 맨 앞에 확실히 — 모델이 놓치지 않도록 태그 형태로 먼저 넣는다
    const gender = genderEn(f.gender);
    const genderTokens = gender === 'female' ? '1girl, female character, feminine features'
      : (gender === 'male' ? '1boy, male character, masculine features'
        : (gender === 'androgynous' ? 'androgynous character, ambiguous features' : ''));
    if (genderTokens) parts.push(genderTokens);

    const latinName = nameForPrompt(f.name);
    parts.push(latinName ? 'fantasy character portrait of ' + latinName : 'fantasy character portrait');

    const title = String(f.title || '').trim();
    const titleEn = /^[\x20-\x7E]+$/.test(title) ? title.toLowerCase() : '';
    if (titleEn) parts.push(titleEn);

    const race = raceEn(f.race);
    const role = scanEn(title + ' ' + f.faction, ROLE_EN, 1)[0] ||
      scanEn((title + ' ' + String(f.faction || '')).toLowerCase(), ROLE_WORDS, 1)[0] || 'wanderer';
    // 종족·역할 앞에도 성별을 붙여 "a female elf knight"처럼 읽히게
    const article = /^[aeiou]/i.test(race) ? 'an ' : 'a ';
    parts.push(article + (gender ? gender + ' ' : '') + race + ' ' + role);

    const age = agePhrase((f.ageNum !== undefined && f.ageNum !== null && f.ageNum !== '') ? f.ageNum : f.age);
    if (age) parts.push(age);

    const body = bodyPhrase(f.heightCm, f.weightKg);
    if (body) parts.push(body);

    const gear = scanEn(String(f.abilities || '') + ' ' + String(f.title || ''), GEAR_EN, 2);
    if (gear.length) parts.push('wielding ' + gear.join(' and '));

    const mood = scanEn(String(f.personality || '') + ' ' + String(f.notes || ''), MOOD_EN, 2);
    if (mood.length) parts.push(mood.join(', ') + ' expression');

    const faction = String(f.faction || '').trim();
    if (faction) {
      parts.push(/^[\x20-\x7E]+$/.test(faction)
        ? 'member of ' + faction.toLowerCase()
        : 'bearing the sigil of a ' + (scanEn(faction, ROLE_EN, 1)[0] || 'secret order'));
    }

    const style = 'dark fantasy oil painting, painterly brushwork, dramatic chiaroscuro rim light, '
      + 'ornate engraved background, gold filigree accents, intricate costume details, '
      + 'centered vertical bust composition, looking at viewer, highly detailed face, 4k concept art';
    return parts.filter(Boolean).join(', ') + ', ' + style + ', no text, no watermark, no logo';
  }

  const IMG_ENDPOINT = 'https://image.pollinations.ai/prompt/';

  function portraitUrl(prompt, seed) {
    return IMG_ENDPOINT + encodeURIComponent(String(prompt || '').slice(0, 900)) +
      '?width=768&height=1024&seed=' + (seed || Math.floor(Math.random() * 1e9)) +
      '&nologo=true&model=flux&referrer=arcanum';
  }

  function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result));
      fr.onerror = () => reject(new Error('이미지를 읽지 못했어요'));
      fr.readAsDataURL(blob);
    });
  }

  function withTimeout(promise, ms) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('시간 초과')), ms);
      promise.then((v) => { clearTimeout(timer); resolve(v); },
        (e) => { clearTimeout(timer); reject(e); });
    });
  }

  // 1) fetch(blob) → 2) <img crossOrigin> 순서로 시도. 둘 다 안 되면 예외.
  async function loadRemote(url, timeoutMs) {
    const budget = timeoutMs || 22000;
    let ctrl = null;
    let timer = 0;
    try {
      if (typeof fetch === 'function') {
        if (typeof AbortController !== 'undefined') ctrl = new AbortController();
        timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, budget);
        const res = await fetch(url, { mode: 'cors', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined });
        if (res && res.ok) {
          const blob = await res.blob();
          if (blob && blob.size > 512 && (!blob.type || blob.type.indexOf('image') === 0)) {
            const dataUrl = await blobToDataURL(blob);
            if (dataUrl.indexOf('data:image') === 0) return dataUrl;
          }
          throw new Error('이미지 응답이 아니에요');
        }
        throw new Error('HTTP ' + (res ? res.status : '?') );
      }
      throw new Error('fetch 없음');
    } catch (e) {
      // fetch가 막혔으면(대개 CORS) 이미지 태그로 한 번 더 — 이 시도는 짧게 끊는다
      return await withTimeout(loadViaImg(url), Math.min(9000, budget));
    } finally {
      clearTimeout(timer);
    }
  }

  function loadViaImg(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          const cv = document.createElement('canvas');
          cv.width = img.naturalWidth || 768;
          cv.height = img.naturalHeight || 1024;
          const ctx = cv.getContext('2d');
          ctx.drawImage(img, 0, 0);
          resolve(cv.toDataURL('image/jpeg', 0.88));
        } catch (err) {
          reject(new Error('이미지를 캔버스에 그릴 수 없어요(CORS)'));
        }
      };
      img.onerror = () => reject(new Error('이미지를 불러오지 못했어요'));
      img.src = url;
    });
  }

  async function shrinkToPortrait(src, maxDim, quality) {
    const img = await U.loadImage(src);
    const md = maxDim || 900;
    let w = img.naturalWidth || img.width;
    let h = img.naturalHeight || img.height;
    const scale = Math.min(1, md / Math.max(w, h));
    w = Math.max(1, Math.round(w * scale));
    h = Math.max(1, Math.round(h * scale));
    const cv = document.createElement('canvas');
    cv.width = w;
    cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#171310';
    ctx.fillRect(0, 0, w, h);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, w, h);
    return cv.toDataURL('image/jpeg', quality || 0.85);
  }

  // 원격 AI 시도 → 실패해도 앱은 멈추지 않고 { ok:false, prompt } 를 돌려준다.
  async function generatePortrait(fields, opts) {
    const o = opts || {};
    const prompt = buildPortraitPrompt(fields);
    const url = portraitUrl(prompt, o.seed);
    try {
      const raw = await loadRemote(url, o.timeoutMs || 25000);
      const dataUrl = await shrinkToPortrait(raw, o.maxDim || 900, 0.86);
      if (!dataUrl || dataUrl.length < 2000) throw new Error('빈 이미지');
      return { ok: true, dataUrl, prompt, url };
    } catch (err) {
      return { ok: false, prompt, url, reason: (err && err.message) || '연결 실패' };
    }
  }

  /* ---------------- 오프라인 폴백: 문장(紋章) 실루엣 초상화 ---------------- */
  function hashStr(s) {
    let h = 2166136261;
    const str = String(s || 'arcanum');
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function fallbackPortrait(fields) {
    const f = fields || {};
    const seed = hashStr([f.name, f.title, f.race, f.faction, f.age, f.gender].join('|'));
    const rnd = mulberry32(seed);
    const W = 768, H = 1024;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    if (!ctx) return '';

    const palettes = [
      ['#121a24', '#2b1c2e', '#d4af37'],
      ['#101a16', '#22301f', '#c9b06a'],
      ['#1a1216', '#3a1d22', '#e8c67a'],
      ['#141018', '#241a34', '#b9a9d4'],
      ['#1b1509', '#33260f', '#e6cd86']
    ];
    const pal = palettes[Math.floor(rnd() * palettes.length)];
    const gold = pal[2];

    // 배경
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, pal[0]);
    bg.addColorStop(1, pal[1]);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const radial = ctx.createRadialGradient(W * 0.5, H * 0.42, 40, W * 0.5, H * 0.42, W * 0.92);
    radial.addColorStop(0, 'rgba(255, 240, 200, .16)');
    radial.addColorStop(.55, 'rgba(255, 240, 200, .04)');
    radial.addColorStop(1, 'rgba(0, 0, 0, .55)');
    ctx.fillStyle = radial;
    ctx.fillRect(0, 0, W, H);

    // 별가루
    for (let i = 0; i < 90; i++) {
      const x = rnd() * W, y = rnd() * H * 0.8;
      ctx.globalAlpha = 0.15 + rnd() * 0.5;
      ctx.fillStyle = i % 7 === 0 ? gold : '#f6ecd4';
      ctx.beginPath();
      ctx.arc(x, y, rnd() * 1.5 + 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 문장 원 + 룬
    const cx = W * 0.5, cy = H * 0.40, R = W * 0.30;
    ctx.strokeStyle = gold;
    ctx.globalAlpha = 0.42;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.28;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.86, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([6, 10]);
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.1, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      const r1 = R * 0.92, r2 = R * (i % 3 === 0 ? 1.02 : 0.98);
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 실루엣(어깨 + 머리) — 성별에 따라 어깨 폭을 조금 다르게 잡는다
    const bodyGender = genderEn(f.gender);
    const shoulder = bodyGender === 'female' ? 0.30 : (bodyGender === 'male' ? 0.355 : 0.33);
    const headY = H * 0.40, headRx = W * 0.115, headRy = W * 0.145;
    ctx.save();
    const bodyGrad = ctx.createLinearGradient(0, headY, 0, H);
    bodyGrad.addColorStop(0, '#0d0a08');
    bodyGrad.addColorStop(1, '#1b1410');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(W * 0.5 - W * shoulder, H);
    ctx.bezierCurveTo(W * 0.5 - W * (shoulder + 0.01), H * 0.70, W * 0.5 - W * 0.16, H * 0.58, W * 0.5 - W * 0.075, H * 0.545);
    ctx.lineTo(W * 0.5 - W * 0.045, headY + headRy * 0.86);
    ctx.lineTo(W * 0.5 + W * 0.045, headY + headRy * 0.86);
    ctx.lineTo(W * 0.5 + W * 0.075, H * 0.545);
    ctx.bezierCurveTo(W * 0.5 + W * 0.16, H * 0.58, W * 0.5 + W * (shoulder + 0.01), H * 0.70, W * 0.5 + W * shoulder, H);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(cx, headY, headRx, headRy, 0, 0, Math.PI * 2);
    ctx.fill();

    // 금빛 테두리 빛(림 라이트)
    ctx.strokeStyle = gold;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 3;
    ctx.beginPath();

<script>
